  <rect x="280" y="80" width="240" height="30" rx="5" ry="5" class="box-main"/>
  <text x="400" y="100" class="text-title" text-anchor="middle">classes/</text>

  <rect x="290" y="120" width="220" height="25" rx="5" ry="5" class="box-secondary"/>
  <text x="400" y="137" class="text-normal" text-anchor="middle">generator.php</text>

  <!-- Subdirectorio form -->
  <rect x="295" y="155" width="210" height="30" rx="5" ry="5" class="box-main"/>
  <text x="400" y="175" class="text-title" text-anchor="middle">form/</text>

  <rect x="305" y="190" width="190" height="25" rx="5" ry="5" class="box-secondary"/>
  <text x="400" y="207" class="text-normal" text-anchor="middle">generate_form.php</text>

  <!-- Subdirectorio privacy -->
  <rect x="295" y="225" width="210" height="30" rx="5" ry="5" class="box-main"/>
  <text x="400" y="245" class="text-title" text-anchor="middle">privacy/</text>

  <rect x="305" y="260" width="190" height="25" rx="5" ry="5" class="box-secondary"/>
  <text x="400" y="277" class="text-normal" text-anchor="middle">provider.php</text>

