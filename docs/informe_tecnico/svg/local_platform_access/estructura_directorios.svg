  <rect x="280" y="300" width="240" height="40" rx="5" ry="5" class="box-main"/>
  <text x="400" y="318" class="text-small" text-anchor="middle" font-weight="bold">NO tiene lib.php</text>
  <text x="400" y="333" class="text-small" text-anchor="middle">Diseño moderno sin lib.php</text>

  <!-- Columna derecha: Directorio db -->
  <rect x="540" y="80" width="200" height="30" rx="5" ry="5" class="box-main"/>
  <text x="640" y="100" class="text-title" text-anchor="middle">db/</text>

  <rect x="550" y="120" width="180" height="25" rx="5" ry="5" class="box-secondary"/>
  <text x="640" y="137" class="text-normal" text-anchor="middle">access.php</text>

  <text x="640" y="165" class="text-small" text-anchor="middle" font-style="italic">NO tiene install.xml</text>
  <text x="640" y="180" class="text-small" text-anchor="middle" font-style="italic">NO crea tablas propias</text>

  <!-- Directorio lang -->
  <rect x="540" y="200" width="200" height="30" rx="5" ry="5" class="box-main"/>
  <text x="640" y="220" class="text-title" text-anchor="middle">lang/</text>

  <rect x="550" y="240" width="80" height="25" rx="5" ry="5" class="box-secondary"/>
  <text x="590" y="257" class="text-normal" text-anchor="middle">en/</text>

  <rect x="650" y="240" width="80" height="25" rx="5" ry="5" class="box-secondary"/>
  <text x="690" y="257" class="text-normal" text-anchor="middle">es/</text>

  <rect x="550" y="270" width="180" height="40" rx="5" ry="5" class="box-secondary"/>
  <text x="640" y="287" class="text-small" text-anchor="middle">local_platform_access.php</text>
  <text x="640" y="302" class="text-small" text-anchor="middle">(101 cadenas)</text>

