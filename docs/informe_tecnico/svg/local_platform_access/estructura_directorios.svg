  <text x="400" y="385" class="text-white" text-anchor="middle">Tablas de Base de Datos Utilizadas (no propias)</text>

  <!-- Tablas Moodle -->
  <rect x="60" y="410" width="330" height="30" rx="5" ry="5" class="box-main"/>
  <text x="225" y="430" class="text-title" text-anchor="middle">Tablas Moodle (INSERT/UPDATE)</text>

  <rect x="70" y="450" width="150" height="25" rx="5" ry="5" class="box-secondary"/>
  <text x="145" y="467" class="text-small" text-anchor="middle">logstore_standard_log</text>

  <rect x="230" y="450" width="150" height="25" rx="5" ry="5" class="box-secondary"/>
  <text x="305" y="467" class="text-small" text-anchor="middle">user</text>

  <rect x="70" y="480" width="150" height="25" rx="5" ry="5" class="box-secondary"/>
  <text x="145" y="497" class="text-small" text-anchor="middle">user_lastaccess</text>

  <rect x="230" y="480" width="150" height="25" rx="5" ry="5" class="box-secondary"/>
  <text x="305" y="497" class="text-small" text-anchor="middle">course_completions</text>

  <rect x="70" y="510" width="150" height="25" rx="5" ry="5" class="box-secondary"/>
  <text x="145" y="527" class="text-small" text-anchor="middle">course_modules_completion</text>

  <rect x="230" y="510" width="150" height="25" rx="5" ry="5" class="box-secondary"/>
  <text x="305" y="527" class="text-small" text-anchor="middle">course_modules_viewed</text>

  <!-- Tablas IOMAD -->
  <rect x="410" y="410" width="330" height="30" rx="5" ry="5" class="box-main"/>
  <text x="575" y="430" class="text-title" text-anchor="middle">Tablas IOMAD (SELECT)</text>

  <rect x="420" y="450" width="150" height="25" rx="5" ry="5" class="box-secondary"/>
  <text x="495" y="467" class="text-small" text-anchor="middle">company</text>

  <rect x="580" y="450" width="150" height="25" rx="5" ry="5" class="box-secondary"/>
  <text x="655" y="467" class="text-small" text-anchor="middle">company_users</text>

  <rect x="420" y="480" width="150" height="25" rx="5" ry="5" class="box-secondary"/>
  <text x="495" y="497" class="text-small" text-anchor="middle">company_course</text>

  <rect x="580" y="480" width="150" height="25" rx="5" ry="5" class="box-secondary"/>
  <text x="655" y="497" class="text-small" text-anchor="middle">local_report_user_logins</text>

  <!-- Capabilities -->
  <rect x="50" y="550" width="700" height="40" rx="5" ry="5" class="box-filled-green"/>
  <text x="400" y="575" class="text-white" text-anchor="middle">Capabilities</text>

  <rect x="200" y="600" width="180" height="30" rx="5" ry="5" class="box-secondary"/>
  <text x="290" y="619" class="text-small" text-anchor="middle">:generate (RISK_DATALOSS)</text>

  <rect x="420" y="600" width="180" height="30" rx="5" ry="5" class="box-secondary"/>
  <text x="510" y="619" class="text-small" text-anchor="middle">:view (RISK_PERSONAL)</text>

</svg>
