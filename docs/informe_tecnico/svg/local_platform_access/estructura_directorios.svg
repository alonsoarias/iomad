<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="900" height="550">
  <defs>
    <style>
      .bg { fill: #FAFAFA; }
      .header-bg { fill: #1B9E88; }
      .header-text { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #FFFFFF; }
      .folder-icon { fill: #FCBD05; }
      .folder-text { font-family: 'Consolas', 'Monaco', monospace; font-size: 13px; fill: #1B9E88; font-weight: bold; }
      .subfolder-text { font-family: 'Consolas', 'Monaco', monospace; font-size: 12px; fill: #646363; }
      .file-icon { fill: #EB4335; }
      .file-text { font-family: 'Consolas', 'Monaco', monospace; font-size: 11px; fill: #333333; }
      .tree-line { stroke: #CCCCCC; stroke-width: 1; fill: none; }
      .badge { fill: #1B9E88; }
      .badge-text { font-family: Arial, sans-serif; font-size: 9px; fill: #FFFFFF; }
      .section-title { font-family: Arial, sans-serif; font-size: 11px; fill: #646363; font-weight: bold; }
      .desc-text { font-family: Arial, sans-serif; font-size: 10px; fill: #666666; }
    </style>
    <symbol id="folder" viewBox="0 0 24 24">
      <path d="M10 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/>
    </symbol>
    <symbol id="file" viewBox="0 0 24 24">
      <path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm-1 7V3.5L18.5 9H13z"/>
    </symbol>
  </defs>

  <!-- Background -->
  <rect width="900" height="550" class="bg"/>

  <!-- Header -->
  <rect x="0" y="0" width="900" height="50" class="header-bg"/>
  <text x="450" y="32" text-anchor="middle" class="header-text">Estructura de Directorios - local_platform_access</text>

  <!-- Tree Structure -->
  <g transform="translate(30, 70)">
    <!-- Root folder -->
    <use href="#folder" x="0" y="0" width="20" height="20" class="folder-icon"/>
    <text x="28" y="15" class="folder-text">local/platform_access/</text>
    <rect x="200" y="3" width="115" height="16" rx="3" class="badge"/>
    <text x="257" y="14" text-anchor="middle" class="badge-text">Generador de accesos</text>

    <!-- Vertical line from root -->
    <line x1="10" y1="25" x2="10" y2="340" class="tree-line"/>

    <!-- classes/ -->
    <g transform="translate(0, 40)">
      <line x1="10" y1="10" x2="30" y2="10" class="tree-line"/>
      <use href="#folder" x="30" y="0" width="18" height="18" class="folder-icon"/>
      <text x="55" y="13" class="folder-text">classes/</text>
      <rect x="115" y="0" width="75" height="16" rx="3" class="badge"/>
      <text x="152" y="11" text-anchor="middle" class="badge-text">Logica de negocio</text>

      <line x1="45" y1="25" x2="45" y2="70" class="tree-line"/>

      <!-- classes/form -->
      <g transform="translate(15, 30)">
        <line x1="30" y1="10" x2="50" y2="10" class="tree-line"/>
        <use href="#folder" x="50" y="0" width="16" height="16" class="folder-icon"/>
        <text x="72" y="12" class="subfolder-text">form/</text>
        <use href="#file" x="110" y="0" width="12" height="12" class="file-icon"/>
        <text x="128" y="11" class="file-text">generate_form.php</text>
        <text x="255" y="11" class="desc-text">(formulario de generacion)</text>
      </g>

      <!-- classes/privacy -->
      <g transform="translate(15, 55)">
        <line x1="30" y1="10" x2="50" y2="10" class="tree-line"/>
        <use href="#folder" x="50" y="0" width="16" height="16" class="folder-icon"/>
        <text x="72" y="12" class="subfolder-text">privacy/</text>
        <use href="#file" x="130" y="0" width="12" height="12" class="file-icon"/>
        <text x="148" y="11" class="file-text">provider.php</text>
        <text x="235" y="11" class="desc-text">(cumplimiento GDPR)</text>
      </g>

      <!-- Main class -->
      <g transform="translate(15, 85)">
        <use href="#file" x="45" y="0" width="12" height="12" class="file-icon"/>
        <text x="63" y="10" class="file-text">generator.php</text>
        <text x="165" y="10" class="desc-text">(clase principal: genera usuarios y accesos)</text>
      </g>
    </g>

    <!-- db/ -->
    <g transform="translate(0, 160)">
      <line x1="10" y1="10" x2="30" y2="10" class="tree-line"/>
      <use href="#folder" x="30" y="0" width="18" height="18" class="folder-icon"/>
      <text x="55" y="13" class="folder-text">db/</text>
      <rect x="80" y="0" width="70" height="16" rx="3" class="badge"/>
      <text x="115" y="11" text-anchor="middle" class="badge-text">Base de datos</text>

      <g transform="translate(35, 25)">
        <use href="#file" x="0" y="0" width="12" height="12" class="file-icon"/>
        <text x="18" y="10" class="file-text">access.php</text>
        <text x="100" y="10" class="desc-text">(1 capacidad: local/platform_access:generate)</text>
      </g>
    </g>

    <!-- lang/ -->
    <g transform="translate(0, 215)">
      <line x1="10" y1="10" x2="30" y2="10" class="tree-line"/>
      <use href="#folder" x="30" y="0" width="18" height="18" class="folder-icon"/>
      <text x="55" y="13" class="folder-text">lang/</text>
      <text x="95" y="13" class="subfolder-text">(Traducciones)</text>

      <line x1="45" y1="25" x2="45" y2="55" class="tree-line"/>

      <g transform="translate(15, 30)">
        <line x1="30" y1="10" x2="50" y2="10" class="tree-line"/>
        <use href="#folder" x="50" y="0" width="16" height="16" class="folder-icon"/>
        <text x="72" y="12" class="subfolder-text">en/</text>
        <use href="#file" x="95" y="0" width="12" height="12" class="file-icon"/>
        <text x="113" y="11" class="file-text">local_platform_access.php</text>
      </g>

      <g transform="translate(15, 55)">
        <line x1="30" y1="10" x2="50" y2="10" class="tree-line"/>
        <use href="#folder" x="50" y="0" width="16" height="16" class="folder-icon"/>
        <text x="72" y="12" class="subfolder-text">es/</text>
        <use href="#file" x="95" y="0" width="12" height="12" class="file-icon"/>
        <text x="113" y="11" class="file-text">local_platform_access.php</text>
      </g>
    </g>
  </g>

  <!-- Root files section -->
  <g transform="translate(500, 70)">
    <text x="0" y="0" class="section-title">ARCHIVOS RAIZ:</text>

    <g transform="translate(0, 25)">
      <use href="#file" x="0" y="0" width="14" height="14" class="file-icon"/>
      <text x="20" y="11" class="file-text">version.php</text>
      <text x="120" y="11" class="desc-text">(v2024111900)</text>
    </g>

    <g transform="translate(0, 48)">
      <use href="#file" x="0" y="0" width="14" height="14" class="file-icon"/>
      <text x="20" y="11" class="file-text">index.php</text>
      <text x="95" y="11" class="desc-text">(punto de entrada principal)</text>
    </g>

    <g transform="translate(0, 71)">
      <use href="#file" x="0" y="0" width="14" height="14" class="file-icon"/>
      <text x="20" y="11" class="file-text">generate.php</text>
      <text x="115" y="11" class="desc-text">(procesa generacion)</text>
    </g>

    <g transform="translate(0, 94)">
      <use href="#file" x="0" y="0" width="14" height="14" class="file-icon"/>
      <text x="20" y="11" class="file-text">settings.php</text>
      <text x="105" y="11" class="desc-text">(configuracion admin)</text>
    </g>

    <g transform="translate(0, 117)">
      <use href="#file" x="0" y="0" width="14" height="14" class="file-icon"/>
      <text x="20" y="11" class="file-text">styles.css</text>
      <text x="95" y="11" class="desc-text">(estilos del formulario)</text>
    </g>
  </g>

  <!-- Statistics Box -->
  <g transform="translate(500, 230)">
    <rect x="0" y="0" width="370" height="150" rx="8" fill="#F0F0F0" stroke="#1B9E88" stroke-width="2"/>
    <text x="185" y="25" text-anchor="middle" class="section-title">ESTADISTICAS DEL PLUGIN</text>

    <text x="20" y="55" class="file-text">Carpetas: 3</text>
    <text x="20" y="75" class="file-text">Subcarpetas: 4</text>
    <text x="20" y="95" class="file-text">Archivos PHP: 8</text>
    <text x="20" y="115" class="file-text">Capacidades: 1</text>
    <text x="20" y="135" class="file-text">Idiomas: 2 (es, en)</text>

    <text x="200" y="55" class="file-text">Clases PHP: 3</text>
    <text x="200" y="75" class="file-text">Formularios: 1</text>
    <text x="200" y="95" class="file-text">Estilos CSS: 1</text>
    <text x="200" y="115" class="file-text">Tablas BD: 0</text>
    <text x="200" y="135" class="file-text">Tipo: local</text>
  </g>

  <!-- Purpose Box -->
  <g transform="translate(500, 400)">
    <rect x="0" y="0" width="370" height="80" rx="8" fill="#FFF3E0" stroke="#FCBD05" stroke-width="2"/>
    <text x="185" y="22" text-anchor="middle" class="section-title">PROPOSITO DEL PLUGIN</text>
    <text x="20" y="45" class="desc-text">Genera datos de acceso de prueba para testing.</text>
    <text x="20" y="62" class="desc-text">Crea usuarios ficticios con contrasenas temporales</text>
    <text x="20" y="79" class="desc-text">para simulacion y pruebas de carga de la plataforma.</text>
  </g>

  <!-- Footer note -->
  <rect x="20" y="510" width="860" height="30" rx="5" fill="#E3F2FD" stroke="#1B9E88" stroke-width="1"/>
  <text x="450" y="530" text-anchor="middle" style="font-family: Arial; font-size: 11px; fill: #646363;">
    Plugin auxiliar para generacion de datos de prueba. Estructura minimalista optimizada para Moodle 4.x
  </text>
</svg>
