<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="800" height="650">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#646363"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1B9E88"/>
    </marker>
    <style>
      .box-main { fill: #FFFFFF; stroke: #1B9E88; stroke-width: 2; }
      .box-secondary { fill: #FFFFFF; stroke: #646363; stroke-width: 2; }
      .box-action { fill: #FFFFFF; stroke: #FCBD05; stroke-width: 2; }
      .box-filled-green { fill: #1B9E88; stroke: #1B9E88; stroke-width: 2; }
      .box-filled-yellow { fill: #FCBD05; stroke: #FCBD05; stroke-width: 2; }
      .text-title { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #000000; }
      .text-normal { font-family: Arial, sans-serif; font-size: 12px; fill: #000000; }
      .text-small { font-family: Arial, sans-serif; font-size: 11px; fill: #646363; }
      .text-white { font-family: Arial, sans-serif; font-size: 12px; fill: #FFFFFF; }
      .line { stroke: #646363; stroke-width: 2; fill: none; }
      .line-green { stroke: #1B9E88; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <rect width="800" height="650" fill="#FFFFFF"/>

  <!-- Título -->
  <rect x="200" y="20" width="400" height="40" rx="5" ry="5" class="box-filled-green"/>
  <text x="400" y="45" class="text-white" text-anchor="middle" font-size="16">Arquitectura - local_platform_access</text>

  <!-- Capa de interfaz -->
  <rect x="50" y="80" width="700" height="90" rx="5" ry="5" class="box-main"/>
  <text x="70" y="100" class="text-title">Capa de Interfaz</text>

  <rect x="70" y="110" width="180" height="50" rx="5" ry="5" class="box-secondary"/>
  <text x="160" y="130" class="text-normal" text-anchor="middle">index.php</text>
  <text x="160" y="148" class="text-small" text-anchor="middle">Muestra formulario</text>

  <rect x="270" y="110" width="180" height="50" rx="5" ry="5" class="box-action"/>
  <text x="360" y="130" class="text-normal" text-anchor="middle">generate.php</text>
  <text x="360" y="148" class="text-small" text-anchor="middle">Ejecuta generación</text>

  <rect x="470" y="110" width="260" height="50" rx="5" ry="5" class="box-secondary"/>
  <text x="600" y="130" class="text-normal" text-anchor="middle">settings.php</text>
  <text x="600" y="148" class="text-small" text-anchor="middle">Admin > Development > Platform Access</text>

  <!-- Flechas de interfaz -->
  <line x1="160" y1="160" x2="200" y2="200" class="line-green" marker-end="url(#arrowhead-green)"/>
  <line x1="360" y1="160" x2="400" y2="200" class="line-green" marker-end="url(#arrowhead-green)"/>

  <!-- Capa de lógica de negocio -->
  <rect x="50" y="200" width="700" height="180" rx="5" ry="5" class="box-filled-green"/>
  <text x="70" y="220" class="text-white" font-weight="bold">Capa de Lógica de Negocio</text>

  <!-- Clase generator -->
  <rect x="70" y="235" width="320" height="130" rx="5" ry="5" class="box-secondary"/>
  <text x="230" y="255" class="text-title" text-anchor="middle">Clase: generator</text>
  <text x="80" y="275" class="text-small">• get_users() - Filtra usuarios</text>
  <text x="80" y="292" class="text-small">• run(callback) - Ejecuta generación</text>
  <text x="80" y="309" class="text-small">• clean_existing_records() - TRUNCATE</text>
  <text x="80" y="326" class="text-small">• generate_logins() - Crea logins</text>
  <text x="80" y="343" class="text-small">• generate_course_access() - Accesos curso</text>
  <text x="80" y="360" class="text-small">• get_stats() - Estadísticas</text>

  <!-- Formulario -->
  <rect x="410" y="235" width="170" height="60" rx="5" ry="5" class="box-secondary"/>
  <text x="495" y="255" class="text-title" text-anchor="middle">generate_form</text>
  <text x="420" y="275" class="text-small">Formulario Moodle</text>
  <text x="420" y="292" class="text-small">5 secciones config</text>

  <!-- Privacy provider -->
  <rect x="410" y="305" width="170" height="60" rx="5" ry="5" class="box-secondary"/>
  <text x="495" y="325" class="text-title" text-anchor="middle">provider</text>
  <text x="420" y="345" class="text-small">GDPR Compliance</text>
  <text x="420" y="362" class="text-small">null_provider</text>

  <!-- Flecha de generator a form -->
  <line x1="390" y1="265" x2="410" y2="265" class="line" marker-end="url(#arrowhead)" stroke-dasharray="5,5"/>
  <text x="395" y="255" class="text-small">usa</text>

  <!-- Optimizaciones -->
  <rect x="600" y="235" width="130" height="130" rx="5" ry="5" class="box-filled-yellow"/>
  <text x="665" y="255" class="text-title" text-anchor="middle">Optimizaciones</text>
  <text x="610" y="275" class="text-small">• Buffering (500)</text>
  <text x="610" y="292" class="text-small">• Pre-carga</text>
  <text x="610" y="309" class="text-small">• Cache contextos</text>
  <text x="610" y="326" class="text-small">• TRUNCATE</text>
  <text x="610" y="343" class="text-small">• Sin límite tiempo</text>
  <text x="610" y="360" class="text-small">• MEMORY_HUGE</text>

  <!-- Flecha de generator a optimizaciones -->
  <line x1="390" y1="300" x2="600" y2="300" class="line" marker-end="url(#arrowhead)" stroke-dasharray="5,5"/>

  <!-- Flecha de generator a BD -->
  <line x1="230" y1="365" x2="230" y2="410" class="line-green" marker-end="url(#arrowhead-green)"/>

  <!-- Capa de datos -->
  <rect x="50" y="410" width="700" height="220" rx="5" ry="5" class="box-filled-green"/>
  <text x="70" y="430" class="text-white" font-weight="bold">Capa de Datos (Inserciones Masivas)</text>

  <!-- Tablas Moodle -->
  <rect x="70" y="445" width="330" height="30" rx="5" ry="5" class="box-main"/>
  <text x="235" y="465" class="text-title" text-anchor="middle">Tablas Moodle (INSERT/UPDATE)</text>

  <rect x="80" y="485" width="140" height="35" rx="5" ry="5" class="box-secondary"/>
  <text x="150" y="505" class="text-small" text-anchor="middle">logstore_standard_log</text>
  <text x="150" y="517" class="text-small" text-anchor="middle" font-style="italic">INSERT masivo</text>

  <rect x="230" y="485" width="160" height="35" rx="5" ry="5" class="box-secondary"/>
  <text x="310" y="505" class="text-small" text-anchor="middle">user</text>
  <text x="310" y="517" class="text-small" text-anchor="middle" font-style="italic">UPDATE lastaccess, etc</text>

  <rect x="80" y="530" width="140" height="35" rx="5" ry="5" class="box-secondary"/>
  <text x="150" y="550" class="text-small" text-anchor="middle">user_lastaccess</text>
  <text x="150" y="562" class="text-small" text-anchor="middle" font-style="italic">INSERT/UPDATE</text>

  <rect x="230" y="530" width="160" height="35" rx="5" ry="5" class="box-secondary"/>
  <text x="310" y="550" class="text-small" text-anchor="middle">course_completions</text>
  <text x="310" y="562" class="text-small" text-anchor="middle" font-style="italic">INSERT</text>

  <rect x="80" y="575" width="310" height="45" rx="5" ry="5" class="box-secondary"/>
  <text x="235" y="593" class="text-small" text-anchor="middle">course_modules_completion</text>
  <text x="235" y="605" class="text-small" text-anchor="middle">course_modules_viewed</text>
  <text x="235" y="617" class="text-small" text-anchor="middle" font-style="italic">INSERT masivo (si existen)</text>

  <!-- Tablas IOMAD -->
  <rect x="420" y="445" width="310" height="30" rx="5" ry="5" class="box-main"/>
  <text x="575" y="465" class="text-title" text-anchor="middle">Tablas IOMAD (SELECT/INSERT)</text>

  <rect x="430" y="485" width="140" height="35" rx="5" ry="5" class="box-secondary"/>
  <text x="500" y="505" class="text-small" text-anchor="middle">company</text>
  <text x="500" y="517" class="text-small" text-anchor="middle" font-style="italic">SELECT</text>

  <rect x="580" y="485" width="140" height="35" rx="5" ry="5" class="box-secondary"/>
  <text x="650" y="505" class="text-small" text-anchor="middle">company_users</text>
  <text x="650" y="517" class="text-small" text-anchor="middle" font-style="italic">SELECT</text>

  <rect x="430" y="530" width="140" height="35" rx="5" ry="5" class="box-secondary"/>
  <text x="500" y="550" class="text-small" text-anchor="middle">company_course</text>
  <text x="500" y="562" class="text-small" text-anchor="middle" font-style="italic">SELECT</text>

  <rect x="580" y="530" width="140" height="35" rx="5" ry="5" class="box-secondary"/>
  <text x="650" y="550" class="text-small" text-anchor="middle">local_report_</text>
  <text x="650" y="562" class="text-small" text-anchor="middle">user_logins (INSERT)</text>

  <rect x="430" y="575" width="290" height="45" rx="5" ry="5" class="box-action"/>
  <text x="575" y="593" class="text-small" text-anchor="middle" font-weight="bold">Compatibilidad: Funciona sin IOMAD</text>
  <text x="575" y="610" class="text-small" text-anchor="middle">Detecta automáticamente si tablas existen</text>

  <!-- Flecha de generator a tablas IOMAD -->
  <line x1="400" y1="300" x2="575" y2="410" class="line-green" marker-end="url(#arrowhead-green)"/>

</svg>
