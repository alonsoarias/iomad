<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 950" width="900" height="950">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#646363"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1B9E88"/>
    </marker>
    <marker id="arrowhead-yellow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#FCBD05"/>
    </marker>
    <style>
      .box-main { fill: #FFFFFF; stroke: #1B9E88; stroke-width: 2; }
      .box-secondary { fill: #FFFFFF; stroke: #646363; stroke-width: 2; }
      .box-action { fill: #FFFFFF; stroke: #FCBD05; stroke-width: 2; }
      .box-decision { fill: #FFFFFF; stroke: #EB4335; stroke-width: 2; }
      .box-filled-green { fill: #1B9E88; stroke: #1B9E88; stroke-width: 2; }
      .box-filled-yellow { fill: #FCBD05; stroke: #FCBD05; stroke-width: 2; }
      .text-title { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #000000; }
      .text-normal { font-family: Arial, sans-serif; font-size: 12px; fill: #000000; }
      .text-small { font-family: Arial, sans-serif; font-size: 11px; fill: #646363; }
      .text-white { font-family: Arial, sans-serif; font-size: 12px; fill: #FFFFFF; }
      .line { stroke: #646363; stroke-width: 2; fill: none; }
      .line-green { stroke: #1B9E88; stroke-width: 2; fill: none; }
      .line-yellow { stroke: #FCBD05; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <rect width="900" height="950" fill="#FFFFFF"/>

  <!-- Título -->
  <rect x="250" y="20" width="400" height="40" rx="5" ry="5" class="box-filled-green"/>
  <text x="450" y="45" class="text-white" text-anchor="middle" font-size="16">Flujo de Generación de Datos de Acceso</text>

  <!-- 1. Admin accede -->
  <rect x="350" y="80" width="200" height="50" rx="5" ry="5" class="box-main"/>
  <text x="450" y="100" class="text-title" text-anchor="middle">Admin accede</text>
  <text x="450" y="118" class="text-small" text-anchor="middle">index.php</text>

  <line x1="450" y1="130" x2="450" y2="160" class="line-green" marker-end="url(#arrowhead-green)"/>

  <!-- 2. Muestra formulario -->
  <rect x="350" y="160" width="200" height="50" rx="5" ry="5" class="box-secondary"/>
  <text x="450" y="180" class="text-title" text-anchor="middle">generate_form</text>
  <text x="450" y="198" class="text-small" text-anchor="middle">Configuración opciones</text>

  <line x1="450" y1="210" x2="450" y2="240" class="line-green" marker-end="url(#arrowhead-green)"/>

  <!-- 3. Usuario configura -->
  <rect x="350" y="240" width="200" height="70" rx="5" ry="5" class="box-action"/>
  <text x="450" y="260" class="text-title" text-anchor="middle">Usuario configura</text>
  <text x="450" y="278" class="text-small" text-anchor="middle">• Empresa / Todos</text>
  <text x="450" y="293" class="text-small" text-anchor="middle">• Rango de fechas</text>
  <text x="450" y="308" class="text-small" text-anchor="middle">• Cantidad de accesos</text>

  <line x1="450" y1="310" x2="450" y2="340" class="line-green" marker-end="url(#arrowhead-green)"/>

  <!-- 4. Envía formulario -->
  <rect x="350" y="340" width="200" height="50" rx="5" ry="5" class="box-main"/>
  <text x="450" y="360" class="text-title" text-anchor="middle">Envía formulario</text>
  <text x="450" y="378" class="text-small" text-anchor="middle">Redirige a generate.php</text>

  <line x1="450" y1="390" x2="450" y2="420" class="line-green" marker-end="url(#arrowhead-green)"/>

  <!-- 5. Confirmación -->
  <polygon points="450,420 570,460 450,500 330,460" class="box-decision"/>
  <text x="450" y="460" class="text-title" text-anchor="middle">¿Confirma?</text>

  <line x1="330" y1="460" x2="250" y2="460" class="line" marker-end="url(#arrowhead)"/>
  <text x="280" y="452" class="text-small">No</text>

  <rect x="100" y="435" width="150" height="50" rx="5" ry="5" class="box-secondary"/>
  <text x="175" y="455" class="text-normal" text-anchor="middle">Volver al</text>
  <text x="175" y="473" class="text-normal" text-anchor="middle">formulario</text>

  <line x1="450" y1="500" x2="450" y2="530" class="line-green" marker-end="url(#arrowhead-green)"/>
  <text x="460" y="520" class="text-small">Sí</text>

  <!-- 6. Preparación -->
  <rect x="350" y="530" width="200" height="50" rx="5" ry="5" class="box-filled-yellow"/>
  <text x="450" y="550" class="text-title" text-anchor="middle">Preparar entorno</text>
  <text x="450" y="568" class="text-small" text-anchor="middle">raise_memory, set_time(0)</text>

  <line x1="450" y1="580" x2="450" y2="610" class="line-green" marker-end="url(#arrowhead-green)"/>

  <!-- 7. Crear generator -->
  <rect x="350" y="610" width="200" height="50" rx="5" ry="5" class="box-main"/>
  <text x="450" y="630" class="text-title" text-anchor="middle">Crear generator</text>
  <text x="450" y="648" class="text-small" text-anchor="middle">Con opciones del form</text>

  <line x1="450" y1="660" x2="450" y2="690" class="line-green" marker-end="url(#arrowhead-green)"/>

  <!-- 8. Decisión: Limpiar -->
  <polygon points="450,690 570,730 450,770 330,730" class="box-decision"/>
  <text x="450" y="725" class="text-title" text-anchor="middle">¿Limpiar datos</text>
  <text x="450" y="743" class="text-title" text-anchor="middle">existentes?</text>

  <!-- Rama de limpieza -->
  <line x1="570" y1="730" x2="650" y2="730" class="line-yellow" marker-end="url(#arrowhead-yellow)"/>
  <text x="600" y="722" class="text-small">Sí</text>

  <rect x="650" y="705" width="200" height="50" rx="5" ry="5" class="box-filled-yellow"/>
  <text x="750" y="725" class="text-normal" text-anchor="middle">TRUNCATE tablas</text>
  <text x="750" y="743" class="text-small" text-anchor="middle">Limpieza rápida</text>

  <line x1="750" y1="755" x2="750" y2="800" x2="450" y2="800" class="line-yellow" marker-end="url(#arrowhead-yellow)"/>

  <line x1="450" y1="770" x2="450" y2="820" class="line-green" marker-end="url(#arrowhead-green)"/>
  <text x="460" y="790" class="text-small">No</text>

  <!-- 9. Obtener usuarios -->
  <rect x="350" y="820" width="200" height="50" rx="5" ry="5" class="box-main"/>
  <text x="450" y="840" class="text-title" text-anchor="middle">get_users()</text>
  <text x="450" y="858" class="text-small" text-anchor="middle">Filtrar por empresa/activos</text>

  <line x1="450" y1="870" x2="450" y2="900" class="line-green" marker-end="url(#arrowhead-green)"/>

  <!-- 10. Continúa en segunda columna -->
  <text x="450" y="900" class="text-small" text-anchor="middle" font-style="italic">Continúa procesamiento...</text>

  <!-- SEGUNDA COLUMNA: Procesamiento por usuario -->
  <rect x="50" y="20" width="250" height="40" rx="5" ry="5" class="box-filled-green"/>
  <text x="175" y="45" class="text-white" text-anchor="middle" font-size="14">Por cada usuario</text>

  <rect x="70" y="80" width="210" height="50" rx="5" ry="5" class="box-main"/>
  <text x="175" y="100" class="text-normal" text-anchor="middle">Pre-cargar</text>
  <text x="175" y="118" class="text-small" text-anchor="middle">enrollments y contextos</text>

  <line x1="175" y1="130" x2="175" y2="160" class="line" marker-end="url(#arrowhead)"/>

  <rect x="70" y="160" width="210" height="50" rx="5" ry="5" class="box-action"/>
  <text x="175" y="180" class="text-normal" text-anchor="middle">generate_logins()</text>
  <text x="175" y="198" class="text-small" text-anchor="middle">Eventos de login</text>

  <line x1="175" y1="210" x2="175" y2="240" class="line" marker-end="url(#arrowhead)"/>

  <rect x="70" y="240" width="210" height="50" rx="5" ry="5" class="box-action"/>
  <text x="175" y="260" class="text-normal" text-anchor="middle">generate_dashboard()</text>
  <text x="175" y="278" class="text-small" text-anchor="middle">70% probabilidad</text>

  <line x1="175" y1="290" x2="175" y2="320" class="line" marker-end="url(#arrowhead)"/>

  <rect x="70" y="320" width="210" height="50" rx="5" ry="5" class="box-action"/>
  <text x="175" y="340" class="text-normal" text-anchor="middle">generate_course_access()</text>
  <text x="175" y="358" class="text-small" text-anchor="middle">Accesos a cursos</text>

  <line x1="175" y1="370" x2="175" y2="400" class="line" marker-end="url(#arrowhead)"/>

  <rect x="70" y="400" width="210" height="50" rx="5" ry="5" class="box-action"/>
  <text x="175" y="420" class="text-normal" text-anchor="middle">generate_activity_access()</text>
  <text x="175" y="438" class="text-small" text-anchor="middle">Accesos a actividades</text>

  <line x1="175" y1="450" x2="175" y2="480" class="line" marker-end="url(#arrowhead)"/>

  <rect x="70" y="480" width="210" height="50" rx="5" ry="5" class="box-action"/>
  <text x="175" y="500" class="text-normal" text-anchor="middle">generate_logout()</text>
  <text x="175" y="518" class="text-small" text-anchor="middle">50% probabilidad</text>

  <line x1="175" y1="530" x2="175" y2="560" class="line" marker-end="url(#arrowhead)"/>

  <rect x="70" y="560" width="210" height="50" rx="5" ry="5" class="box-action"/>
  <text x="175" y="580" class="text-normal" text-anchor="middle">generate_completions()</text>
  <text x="175" y="598" class="text-small" text-anchor="middle">Cursos completados</text>

  <line x1="175" y1="610" x2="175" y2="640" class="line" marker-end="url(#arrowhead)"/>

  <rect x="70" y="640" width="210" height="50" rx="5" ry="5" class="box-filled-yellow"/>
  <text x="175" y="660" class="text-normal" text-anchor="middle">Buffer (500 registros)</text>
  <text x="175" y="678" class="text-small" text-anchor="middle">INSERT masivo</text>

  <line x1="175" y1="690" x2="175" y2="720" class="line" marker-end="url(#arrowhead)"/>

  <rect x="70" y="720" width="210" height="50" rx="5" ry="5" class="box-secondary"/>
  <text x="175" y="740" class="text-normal" text-anchor="middle">update_user_fields()</text>
  <text x="175" y="758" class="text-small" text-anchor="middle">lastaccess, lastlogin, etc</text>

  <line x1="175" y1="770" x2="175" y2="800" class="line" marker-end="url(#arrowhead)"/>

  <rect x="70" y="800" width="210" height="50" rx="5" ry="5" class="box-secondary"/>
  <text x="175" y="820" class="text-normal" text-anchor="middle">Barra de progreso</text>
  <text x="175" y="838" class="text-small" text-anchor="middle">Actualizar callback</text>

  <line x1="175" y1="850" x2="175" y2="880" class="line" marker-end="url(#arrowhead)"/>

  <polygon points="175,880 255,915 175,950 95,915" class="box-decision"/>
  <text x="175" y="915" class="text-small" text-anchor="middle">¿Más usuarios?</text>

  <line x1="255" y1="915" x2="280" y2="915" x2="280" y2="100" x2="280" y2="100" class="line" marker-end="url(#arrowhead)" stroke-dasharray="5,5"/>
  <text x="285" y="500" class="text-small">Sí</text>

  <!-- TERCERA COLUMNA: Finalización -->
  <rect x="600" y="80" width="250" height="40" rx="5" ry="5" class="box-filled-green"/>
  <text x="725" y="105" class="text-white" text-anchor="middle" font-size="14">Finalización</text>

  <line x1="175" y1="950" x2="725" y2="150" class="line-green" marker-end="url(#arrowhead-green)"/>
  <text x="450" y="950" class="text-small">No</text>

  <rect x="620" y="150" width="210" height="50" rx="5" ry="5" class="box-main"/>
  <text x="725" y="170" class="text-title" text-anchor="middle">Flush final buffer</text>
  <text x="725" y="188" class="text-small" text-anchor="middle">Insertar registros restantes</text>

  <line x1="725" y1="200" x2="725" y2="230" class="line-green" marker-end="url(#arrowhead-green)"/>

  <rect x="620" y="230" width="210" height="50" rx="5" ry="5" class="box-secondary"/>
  <text x="725" y="250" class="text-title" text-anchor="middle">get_stats()</text>
  <text x="725" y="268" class="text-small" text-anchor="middle">Calcular estadísticas</text>

  <line x1="725" y1="280" x2="725" y2="310" class="line-green" marker-end="url(#arrowhead-green)"/>

  <rect x="620" y="310" width="210" height="120" rx="5" ry="5" class="box-filled-green"/>
  <text x="725" y="330" class="text-white" text-anchor="middle" font-weight="bold">Mostrar estadísticas</text>
  <text x="630" y="350" class="text-small">• users_processed</text>
  <text x="630" y="367" class="text-small">• logins_generated</text>
  <text x="630" y="384" class="text-small">• course_access_generated</text>
  <text x="630" y="401" class="text-small">• activity_access_generated</text>
  <text x="630" y="418" class="text-small">• time_elapsed</text>

  <line x1="725" y1="430" x2="725" y2="460" class="line-green" marker-end="url(#arrowhead-green)"/>

  <rect x="620" y="460" width="210" height="50" rx="5" ry="5" class="box-action"/>
  <text x="725" y="480" class="text-title" text-anchor="middle">Botón "Continue"</text>
  <text x="725" y="498" class="text-small" text-anchor="middle">Volver a index.php</text>

  <!-- Notas de optimización -->
  <rect x="620" y="540" width="210" height="110" rx="5" ry="5" class="box-filled-yellow"/>
  <text x="725" y="560" class="text-title" text-anchor="middle">Optimizaciones clave</text>
  <text x="630" y="580" class="text-small">• Batch size: 500 registros</text>
  <text x="630" y="597" class="text-small">• TRUNCATE vs DELETE</text>
  <text x="630" y="614" class="text-small">• Pre-carga de datos</text>
  <text x="630" y="631" class="text-small">• Sin límite de tiempo</text>

</svg>
