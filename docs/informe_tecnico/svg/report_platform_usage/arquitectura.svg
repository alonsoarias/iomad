<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" width="800" height="700">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#646363"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1B9E88"/>
    </marker>
    <style>
      .box-main { fill: #FFFFFF; stroke: #1B9E88; stroke-width: 2; }
      .box-secondary { fill: #FFFFFF; stroke: #646363; stroke-width: 2; }
      .box-action { fill: #FFFFFF; stroke: #FCBD05; stroke-width: 2; }
      .box-filled-green { fill: #1B9E88; stroke: #1B9E88; stroke-width: 2; }
      .box-filled-yellow { fill: #FCBD05; stroke: #FCBD05; stroke-width: 2; }
      .text-title { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #000000; }
      .text-normal { font-family: Arial, sans-serif; font-size: 12px; fill: #000000; }
      .text-small { font-family: Arial, sans-serif; font-size: 11px; fill: #646363; }
      .text-white { font-family: Arial, sans-serif; font-size: 12px; fill: #FFFFFF; }
      .line { stroke: #646363; stroke-width: 2; fill: none; }
      .line-green { stroke: #1B9E88; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <rect width="800" height="700" fill="#FFFFFF"/>

  <!-- Título de la arquitectura -->
  <rect x="200" y="20" width="400" height="40" rx="5" ry="5" class="box-filled-green"/>
  <text x="400" y="45" class="text-white" text-anchor="middle" font-size="16">Arquitectura - report_platform_usage</text>

  <!-- Capa de interfaz -->
  <rect x="50" y="80" width="700" height="100" rx="5" ry="5" class="box-main"/>
  <text x="70" y="100" class="text-title">Capa de Interfaz</text>

  <rect x="70" y="110" width="130" height="60" rx="5" ry="5" class="box-secondary"/>
  <text x="135" y="130" class="text-normal" text-anchor="middle">index.php</text>
  <text x="135" y="147" class="text-small" text-anchor="middle">Dashboard</text>
  <text x="135" y="162" class="text-small" text-anchor="middle">con gráficos</text>

  <rect x="220" y="110" width="130" height="60" rx="5" ry="5" class="box-secondary"/>
  <text x="285" y="130" class="text-normal" text-anchor="middle">ajax.php</text>
  <text x="285" y="147" class="text-small" text-anchor="middle">Actualización</text>
  <text x="285" y="162" class="text-small" text-anchor="middle">dinámica JSON</text>

  <rect x="370" y="110" width="130" height="60" rx="5" ry="5" class="box-secondary"/>
  <text x="435" y="130" class="text-normal" text-anchor="middle">export.php</text>
  <text x="435" y="147" class="text-small" text-anchor="middle">Descarga de</text>
  <text x="435" y="162" class="text-small" text-anchor="middle">Excel/CSV</text>

  <rect x="520" y="110" width="210" height="60" rx="5" ry="5" class="box-action"/>
  <text x="625" y="130" class="text-normal" text-anchor="middle">lib.php</text>
  <text x="625" y="147" class="text-small" text-anchor="middle">extend_navigation_course()</text>
  <text x="625" y="162" class="text-small" text-anchor="middle">extend_settings_navigation()</text>

  <!-- Flechas de interfaz a lógica -->
  <line x1="135" y1="170" x2="200" y2="210" class="line-green" marker-end="url(#arrowhead-green)"/>
  <line x1="285" y1="170" x2="250" y2="210" class="line-green" marker-end="url(#arrowhead-green)"/>
  <line x1="435" y1="170" x2="400" y2="250" class="line-green" marker-end="url(#arrowhead-green)"/>

  <!-- Capa de lógica de negocio -->
  <rect x="50" y="210" width="700" height="180" rx="5" ry="5" class="box-filled-green"/>
  <text x="70" y="230" class="text-white" font-weight="bold">Capa de Lógica de Negocio</text>

  <!-- Clase report -->
  <rect x="70" y="245" width="300" height="130" rx="5" ry="5" class="box-secondary"/>
  <text x="220" y="265" class="text-title" text-anchor="middle">Clase: report</text>
  <text x="80" y="285" class="text-small">• get_login_summary()</text>
  <text x="80" y="302" class="text-small">• get_user_activity()</text>
  <text x="80" y="319" class="text-small">• get_top_courses()</text>
  <text x="80" y="336" class="text-small">• get_top_activities()</text>
  <text x="80" y="353" class="text-small">• get_course_completions()</text>
  <text x="80" y="370" class="text-small">• get_dedication_data()</text>

  <!-- Clases de exportación -->
  <rect x="390" y="245" width="170" height="60" rx="5" ry="5" class="box-secondary"/>
  <text x="475" y="265" class="text-title" text-anchor="middle">exporter</text>
  <text x="400" y="285" class="text-small">CSV/Excel básico</text>
  <text x="400" y="302" class="text-small">8 tipos de export</text>

  <rect x="390" y="315" width="170" height="60" rx="5" ry="5" class="box-secondary"/>
  <text x="475" y="335" class="text-title" text-anchor="middle">excel_exporter</text>
  <text x="400" y="355" class="text-small">Excel con gráficos</text>
  <text x="400" y="372" class="text-small">Formato profesional</text>

  <!-- Clase privacy provider -->
  <rect x="580" y="245" width="150" height="60" rx="5" ry="5" class="box-secondary"/>
  <text x="655" y="265" class="text-title" text-anchor="middle">provider</text>
  <text x="590" y="285" class="text-small">GDPR Compliance</text>
  <text x="590" y="302" class="text-small">null_provider</text>

  <!-- Flecha de report a exporters -->
  <line x1="370" y1="275" x2="390" y2="275" class="line" marker-end="url(#arrowhead)"/>
  <line x1="370" y1="345" x2="390" y2="345" class="line" marker-end="url(#arrowhead)"/>

  <!-- Capa de datos y tareas -->
  <rect x="50" y="410" width="340" height="150" rx="5" ry="5" class="box-main"/>
  <text x="70" y="430" class="text-title">Tarea Programada</text>

  <rect x="70" y="445" width="300" height="100" rx="5" ry="5" class="box-filled-yellow"/>
  <text x="220" y="465" class="text-title" text-anchor="middle">dedication_collector</text>
  <text x="80" y="485" class="text-small">• Se ejecuta diariamente 01:30</text>
  <text x="80" y="502" class="text-small">• Procesa logs desde última ejecución</text>
  <text x="80" y="519" class="text-small">• Calcula sesiones por usuario/curso</text>
  <text x="80" y="536" class="text-small">• Almacena en report_platform_usage_ded</text>

  <!-- Flecha de dedication_collector a BD -->
  <line x1="220" y1="545" x2="220" y2="580" class="line" marker-end="url(#arrowhead)"/>

  <!-- Sistema de caché -->
  <rect x="410" y="410" width="340" height="150" rx="5" ry="5" class="box-main"/>
  <text x="430" y="430" class="text-title">Sistema de Caché (MUC)</text>

  <rect x="430" y="445" width="150" height="60" rx="5" ry="5" class="box-secondary"/>
  <text x="505" y="465" class="text-normal" text-anchor="middle">reportdata</text>
  <text x="505" y="482" class="text-small" text-anchor="middle">TTL: 5 minutos</text>
  <text x="505" y="497" class="text-small" text-anchor="middle">Métricas</text>

  <rect x="600" y="445" width="130" height="60" rx="5" ry="5" class="box-secondary"/>
  <text x="665" y="465" class="text-normal" text-anchor="middle">companyusers</text>
  <text x="665" y="482" class="text-small" text-anchor="middle">TTL: 10 min</text>
  <text x="665" y="497" class="text-small" text-anchor="middle">IOMAD</text>

  <text x="580" y="530" class="text-small" text-anchor="middle">Cache-aside pattern</text>
  <text x="580" y="547" class="text-small" text-anchor="middle">Lazy loading</text>

  <!-- Flecha de clase report a caché -->
  <line x1="220" y1="375" x2="505" y2="410" class="line-green" marker-end="url(#arrowhead-green)" stroke-dasharray="5,5"/>

  <!-- Base de datos -->
  <rect x="50" y="580" width="700" height="100" rx="5" ry="5" class="box-filled-green"/>
  <text x="70" y="600" class="text-white" font-weight="bold">Capa de Datos</text>

  <rect x="70" y="615" width="180" height="55" rx="5" ry="5" class="box-secondary"/>
  <text x="160" y="635" class="text-normal" text-anchor="middle">report_platform_</text>
  <text x="160" y="651" class="text-normal" text-anchor="middle">usage_ded</text>
  <text x="160" y="665" class="text-small" text-anchor="middle">(propia)</text>

  <rect x="270" y="615" width="150" height="55" rx="5" ry="5" class="box-secondary"/>
  <text x="345" y="635" class="text-small" text-anchor="middle">logstore_</text>
  <text x="345" y="651" class="text-small" text-anchor="middle">standard_log</text>
  <text x="345" y="665" class="text-small" text-anchor="middle">(Moodle)</text>

  <rect x="440" y="615" width="120" height="55" rx="5" ry="5" class="box-secondary"/>
  <text x="500" y="635" class="text-small" text-anchor="middle">user</text>
  <text x="500" y="651" class="text-small" text-anchor="middle">course</text>
  <text x="500" y="665" class="text-small" text-anchor="middle">(Moodle)</text>

  <rect x="580" y="615" width="150" height="55" rx="5" ry="5" class="box-secondary"/>
  <text x="655" y="635" class="text-small" text-anchor="middle">course_</text>
  <text x="655" y="651" class="text-small" text-anchor="middle">completions</text>
  <text x="655" y="665" class="text-small" text-anchor="middle">(Moodle)</text>

  <!-- Flechas de clase report a BD -->
  <line x1="220" y1="375" x2="220" y2="580" class="line" marker-end="url(#arrowhead)"/>

</svg>
