<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#646363"/>
    </marker>
    <style>
      .box-main { fill: #FFFFFF; stroke: #1B9E88; stroke-width: 2; }
      .box-secondary { fill: #FFFFFF; stroke: #646363; stroke-width: 2; }
      .box-filled-green { fill: #1B9E88; stroke: #1B9E88; stroke-width: 2; }
      .text-title { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #000000; }
      .text-normal { font-family: Arial, sans-serif; font-size: 12px; fill: #000000; }
      .text-small { font-family: Arial, sans-serif; font-size: 11px; fill: #646363; }
      .text-white { font-family: Arial, sans-serif; font-size: 12px; fill: #FFFFFF; }
      .line { stroke: #646363; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <rect width="800" height="600" fill="#FFFFFF"/>

  <!-- Raíz del plugin -->
  <rect x="50" y="20" width="700" height="40" rx="5" ry="5" class="box-filled-green"/>
  <text x="400" y="45" class="text-white" text-anchor="middle">/report/platform_usage/</text>

  <!-- Columna izquierda: Páginas principales -->
  <rect x="60" y="80" width="200" height="30" rx="5" ry="5" class="box-main"/>
  <text x="160" y="100" class="text-title" text-anchor="middle">Páginas</text>

  <rect x="70" y="120" width="180" height="25" rx="5" ry="5" class="box-secondary"/>
  <text x="160" y="137" class="text-normal" text-anchor="middle">index.php</text>

  <rect x="70" y="150" width="180" height="25" rx="5" ry="5" class="box-secondary"/>
  <text x="160" y="167" class="text-normal" text-anchor="middle">ajax.php</text>

  <rect x="70" y="180" width="180" height="25" rx="5" ry="5" class="box-secondary"/>
  <text x="160" y="197" class="text-normal" text-anchor="middle">export.php</text>

  <rect x="70" y="210" width="180" height="25" rx="5" ry="5" class="box-secondary"/>
  <text x="160" y="227" class="text-normal" text-anchor="middle">lib.php</text>

  <rect x="70" y="240" width="180" height="25" rx="5" ry="5" class="box-secondary"/>
  <text x="160" y="257" class="text-normal" text-anchor="middle">settings.php</text>

  <rect x="70" y="270" width="180" height="25" rx="5" ry="5" class="box-secondary"/>
  <text x="160" y="287" class="text-normal" text-anchor="middle">version.php</text>

  <!-- Columna central: Directorio classes -->
  <rect x="280" y="80" width="220" height="30" rx="5" ry="5" class="box-main"/>
  <text x="390" y="100" class="text-title" text-anchor="middle">classes/</text>

  <rect x="290" y="120" width="200" height="25" rx="5" ry="5" class="box-secondary"/>
  <text x="390" y="137" class="text-normal" text-anchor="middle">report.php</text>

  <rect x="290" y="150" width="200" height="25" rx="5" ry="5" class="box-secondary"/>
  <text x="390" y="167" class="text-normal" text-anchor="middle">exporter.php</text>

  <rect x="290" y="180" width="200" height="25" rx="5" ry="5" class="box-secondary"/>
  <text x="390" y="197" class="text-normal" text-anchor="middle">excel_exporter.php</text>

  <!-- Subdirectorio task -->
  <rect x="295" y="210" width="190" height="30" rx="5" ry="5" class="box-main"/>
  <text x="390" y="230" class="text-title" text-anchor="middle">task/</text>

  <rect x="305" y="245" width="170" height="25" rx="5" ry="5" class="box-secondary"/>
  <text x="390" y="262" class="text-normal" text-anchor="middle">dedication_collector.php</text>

  <!-- Subdirectorio privacy -->
  <rect x="295" y="280" width="190" height="30" rx="5" ry="5" class="box-main"/>
  <text x="390" y="300" class="text-title" text-anchor="middle">privacy/</text>

  <rect x="305" y="315" width="170" height="25" rx="5" ry="5" class="box-secondary"/>
  <text x="390" y="332" class="text-normal" text-anchor="middle">provider.php</text>

  <!-- Columna derecha superior: Directorio db -->
  <rect x="520" y="80" width="220" height="30" rx="5" ry="5" class="box-main"/>
  <text x="630" y="100" class="text-title" text-anchor="middle">db/</text>

  <rect x="530" y="120" width="200" height="25" rx="5" ry="5" class="box-secondary"/>
  <text x="630" y="137" class="text-normal" text-anchor="middle">access.php</text>

  <rect x="530" y="150" width="200" height="25" rx="5" ry="5" class="box-secondary"/>
  <text x="630" y="167" class="text-normal" text-anchor="middle">caches.php</text>

  <rect x="530" y="180" width="200" height="25" rx="5" ry="5" class="box-secondary"/>
  <text x="630" y="197" class="text-normal" text-anchor="middle">tasks.php</text>

  <rect x="530" y="210" width="200" height="25" rx="5" ry="5" class="box-secondary"/>
  <text x="630" y="227" class="text-normal" text-anchor="middle">upgrade.php</text>

  <rect x="530" y="240" width="200" height="25" rx="5" ry="5" class="box-secondary"/>
  <text x="630" y="257" class="text-normal" text-anchor="middle">install.xml</text>

  <!-- Directorio lang -->
  <rect x="520" y="280" width="220" height="30" rx="5" ry="5" class="box-main"/>
  <text x="630" y="300" class="text-title" text-anchor="middle">lang/</text>

  <rect x="530" y="315" width="90" height="25" rx="5" ry="5" class="box-secondary"/>
  <text x="575" y="332" class="text-normal" text-anchor="middle">en/</text>

  <rect x="640" y="315" width="90" height="25" rx="5" ry="5" class="box-secondary"/>
  <text x="685" y="332" class="text-normal" text-anchor="middle">es/</text>

  <!-- Base de datos -->
  <rect x="50" y="370" width="340" height="40" rx="5" ry="5" class="box-filled-green"/>
  <text x="220" y="395" class="text-white" text-anchor="middle">Tabla de Base de Datos</text>

  <rect x="60" y="420" width="320" height="50" rx="5" ry="5" class="box-secondary"/>
  <text x="220" y="440" class="text-normal" text-anchor="middle">report_platform_usage_ded</text>
  <text x="220" y="458" class="text-small" text-anchor="middle">Almacena datos pre-calculados de dedicación</text>

  <!-- Tablas externas -->
  <rect x="410" y="370" width="340" height="40" rx="5" ry="5" class="box-filled-green"/>
  <text x="580" y="395" class="text-white" text-anchor="middle">Tablas Externas Utilizadas</text>

  <rect x="420" y="420" width="150" height="25" rx="5" ry="5" class="box-secondary"/>
  <text x="495" y="437" class="text-small" text-anchor="middle">logstore_standard_log</text>

  <rect x="590" y="420" width="150" height="25" rx="5" ry="5" class="box-secondary"/>
  <text x="665" y="437" class="text-small" text-anchor="middle">user</text>

  <rect x="420" y="450" width="150" height="25" rx="5" ry="5" class="box-secondary"/>
  <text x="495" y="467" class="text-small" text-anchor="middle">course</text>

  <rect x="590" y="450" width="150" height="25" rx="5" ry="5" class="box-secondary"/>
  <text x="665" y="467" class="text-small" text-anchor="middle">course_completions</text>

  <!-- Capabilities -->
  <rect x="50" y="500" width="340" height="40" rx="5" ry="5" class="box-filled-green"/>
  <text x="220" y="525" class="text-white" text-anchor="middle">Capabilities</text>

  <rect x="60" y="550" width="150" height="30" rx="5" ry="5" class="box-secondary"/>
  <text x="135" y="569" class="text-small" text-anchor="middle">:view</text>

  <rect x="230" y="550" width="150" height="30" rx="5" ry="5" class="box-secondary"/>
  <text x="305" y="569" class="text-small" text-anchor="middle">:export</text>

  <!-- Sistema de Caché -->
  <rect x="410" y="500" width="340" height="40" rx="5" ry="5" class="box-filled-green"/>
  <text x="580" y="525" class="text-white" text-anchor="middle">Sistema de Caché (MUC)</text>

  <rect x="420" y="550" width="150" height="30" rx="5" ry="5" class="box-secondary"/>
  <text x="495" y="569" class="text-small" text-anchor="middle">reportdata (5 min)</text>

  <rect x="590" y="550" width="150" height="30" rx="5" ry="5" class="box-secondary"/>
  <text x="665" y="569" class="text-small" text-anchor="middle">companyusers (10 min)</text>

</svg>
