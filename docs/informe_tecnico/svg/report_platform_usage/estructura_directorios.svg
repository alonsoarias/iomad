        <use href="#folder" x="50" y="0" width="16" height="16" class="folder-icon"/>
        <text x="72" y="12" class="subfolder-text">task/</text>
        <use href="#file" x="110" y="0" width="12" height="12" class="file-icon"/>
        <text x="128" y="11" class="file-text">dedication_collector.php</text>
        <text x="295" y="11" class="desc-text">(tarea cron)</text>
