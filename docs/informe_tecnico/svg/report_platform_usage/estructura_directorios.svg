      <text x="120" y="11" class="desc-text">(v2024111800)</text>
    </g>

    <g transform="translate(0, 48)">
      <use href="#file" x="0" y="0" width="14" height="14" class="file-icon"/>
      <text x="20" y="11" class="file-text">lib.php</text>
      <text x="80" y="11" class="desc-text">(callbacks de navegacion)</text>
    </g>

    <g transform="translate(0, 71)">
      <use href="#file" x="0" y="0" width="14" height="14" class="file-icon"/>
      <text x="20" y="11" class="file-text">index.php</text>
      <text x="95" y="11" class="desc-text">(punto de entrada principal)</text>
    </g>

    <g transform="translate(0, 94)">
      <use href="#file" x="0" y="0" width="14" height="14" class="file-icon"/>
      <text x="20" y="11" class="file-text">export.php</text>
      <text x="100" y="11" class="desc-text">(exportacion de datos)</text>
    </g>

    <g transform="translate(0, 117)">
      <use href="#file" x="0" y="0" width="14" height="14" class="file-icon"/>
      <text x="20" y="11" class="file-text">ajax.php</text>
      <text x="85" y="11" class="desc-text">(endpoints AJAX)</text>
    </g>

    <g transform="translate(0, 140)">
      <use href="#file" x="0" y="0" width="14" height="14" class="file-icon"/>
      <text x="20" y="11" class="file-text">settings.php</text>
      <text x="105" y="11" class="desc-text">(configuracion admin)</text>
    </g>

    <g transform="translate(0, 163)">
      <use href="#file" x="0" y="0" width="14" height="14" class="file-icon"/>
      <text x="20" y="11" class="file-text">styles.css</text>
      <text x="95" y="11" class="desc-text">(estilos del dashboard)</text>
    </g>
  </g>

  <!-- Statistics Box -->
  <g transform="translate(500, 280)">
    <rect x="0" y="0" width="370" height="170" rx="8" fill="#F0F0F0" stroke="#1B9E88" stroke-width="2"/>
    <text x="185" y="25" text-anchor="middle" class="section-title">ESTADISTICAS DEL PLUGIN</text>

    <text x="20" y="55" class="file-text">Carpetas: 5</text>
    <text x="20" y="75" class="file-text">Subcarpetas: 4</text>
    <text x="20" y="95" class="file-text">Archivos PHP: 15</text>
    <text x="20" y="115" class="file-text">Tablas en BD: 2</text>
    <text x="20" y="135" class="file-text">Capacidades: 2</text>

    <text x="200" y="55" class="file-text">Clases PHP: 5</text>
    <text x="200" y="75" class="file-text">Modulos AMD: 1</text>
    <text x="200" y="95" class="file-text">Tareas Cron: 1</text>
    <text x="200" y="115" class="file-text">Idiomas: 2 (es, en)</text>
    <text x="200" y="135" class="file-text">Exportadores: 2</text>

    <line x1="20" y1="150" x2="350" y2="150" stroke="#DDD" stroke-width="1"/>
    <text x="185" y="165" text-anchor="middle" class="desc-text">Tipo: report | Requiere: Moodle 4.1+</text>
  </g>

  <!-- Footer note -->
  <rect x="20" y="610" width="860" height="30" rx="5" fill="#E8F5E9" stroke="#1B9E88" stroke-width="1"/>
  <text x="450" y="630" text-anchor="middle" style="font-family: Arial; font-size: 11px; fill: #646363;">
    Plugin de reportes para metricas de uso de la plataforma Moodle. Estructura optimizada para Moodle 4.x
  </text>
</svg>
