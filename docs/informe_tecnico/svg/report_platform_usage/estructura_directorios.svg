      <g transform="translate(15, 85)">
        <use href="#file" x="45" y="0" width="12" height="12" class="file-icon"/>
        <text x="63" y="10" class="file-text">report.php</text>
        <text x="145" y="10" class="desc-text">(generacion de reportes)</text>
      </g>
      <g transform="translate(15, 102)">
        <use href="#file" x="45" y="0" width="12" height="12" class="file-icon"/>
        <text x="63" y="10" class="file-text">exporter.php</text>
        <text x="155" y="10" class="desc-text">(exportacion general)</text>
      </g>
      <g transform="translate(15, 119)">
        <use href="#file" x="45" y="0" width="12" height="12" class="file-icon"/>
        <text x="63" y="10" class="file-text">excel_exporter.php</text>
        <text x="185" y="10" class="desc-text">(exportacion Excel)</text>
      </g>
