<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="800" height="900">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#646363"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1B9E88"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#EB4335"/>
    </marker>
    <style>
      .box-main { fill: #FFFFFF; stroke: #1B9E88; stroke-width: 2; }
      .box-secondary { fill: #FFFFFF; stroke: #646363; stroke-width: 2; }
      .box-action { fill: #FFFFFF; stroke: #FCBD05; stroke-width: 2; }
      .box-decision { fill: #FFFFFF; stroke: #EB4335; stroke-width: 2; }
      .box-filled-green { fill: #1B9E88; stroke: #1B9E88; stroke-width: 2; }
      .text-title { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #000000; }
      .text-normal { font-family: Arial, sans-serif; font-size: 12px; fill: #000000; }
      .text-small { font-family: Arial, sans-serif; font-size: 11px; fill: #646363; }
      .text-white { font-family: Arial, sans-serif; font-size: 12px; fill: #FFFFFF; }
      .line { stroke: #646363; stroke-width: 2; fill: none; }
      .line-green { stroke: #1B9E88; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <rect width="800" height="900" fill="#FFFFFF"/>

  <!-- Título -->
  <rect x="200" y="20" width="400" height="40" rx="5" ry="5" class="box-filled-green"/>
  <text x="400" y="45" class="text-white" text-anchor="middle" font-size="16">Flujo de Generación de Reportes</text>

  <!-- 1. Usuario accede -->
  <rect x="300" y="80" width="200" height="50" rx="5" ry="5" class="box-main"/>
  <text x="400" y="100" class="text-title" text-anchor="middle">Usuario accede</text>
  <text x="400" y="118" class="text-small" text-anchor="middle">index.php o ajax.php</text>

  <!-- Flecha -->
  <line x1="400" y1="130" x2="400" y2="160" class="line-green" marker-end="url(#arrowhead-green)"/>

  <!-- 2. Validación de permisos -->
  <rect x="300" y="160" width="200" height="50" rx="5" ry="5" class="box-action"/>
  <text x="400" y="180" class="text-title" text-anchor="middle">require_capability()</text>
  <text x="400" y="198" class="text-small" text-anchor="middle">:view o :export</text>

  <!-- Flecha -->
  <line x1="400" y1="210" x2="400" y2="240" class="line-green" marker-end="url(#arrowhead-green)"/>

  <!-- 3. Crear instancia report -->
  <rect x="300" y="240" width="200" height="50" rx="5" ry="5" class="box-main"/>
  <text x="400" y="260" class="text-title" text-anchor="middle">Crear report</text>
  <text x="400" y="278" class="text-small" text-anchor="middle">con filtros (fechas, empresa)</text>

  <!-- Flecha -->
  <line x1="400" y1="290" x2="400" y2="320" class="line-green" marker-end="url(#arrowhead-green)"/>

  <!-- 4. Decisión: Caché disponible -->
  <polygon points="400,320 520,360 400,400 280,360" class="box-decision"/>
  <text x="400" y="360" class="text-title" text-anchor="middle">¿Caché</text>
  <text x="400" y="378" class="text-title" text-anchor="middle">disponible?</text>

  <!-- Flecha SÍ -->
  <line x1="520" y1="360" x2="600" y2="360" class="line" marker-end="url(#arrowhead)"/>
  <text x="550" y="352" class="text-small">Sí</text>

  <!-- Flecha NO -->
  <line x1="400" y1="400" x2="400" y2="430" class="line" marker-end="url(#arrowhead)"/>
  <text x="410" y="420" class="text-small">No</text>

  <!-- 5. Retornar desde caché -->
  <rect x="600" y="335" width="150" height="50" rx="5" ry="5" class="box-secondary"/>
  <text x="675" y="355" class="text-normal" text-anchor="middle">Retornar datos</text>
  <text x="675" y="373" class="text-small" text-anchor="middle">desde caché</text>

  <!-- Flecha desde caché a renderizar -->
  <path d="M 675 385 L 675 620 L 500 620 L 500 670" class="line" marker-end="url(#arrowhead)"/>

  <!-- 6. Consultas SQL -->
  <rect x="300" y="430" width="200" height="50" rx="5" ry="5" class="box-action"/>
  <text x="400" y="450" class="text-title" text-anchor="middle">Ejecutar queries</text>
  <text x="400" y="468" class="text-small" text-anchor="middle">a logstore y otras tablas</text>

  <!-- Flecha -->
  <line x1="400" y1="480" x2="400" y2="510" class="line-green" marker-end="url(#arrowhead-green)"/>

  <!-- 7. Procesar datos -->
  <rect x="300" y="510" width="200" height="50" rx="5" ry="5" class="box-main"/>
  <text x="400" y="530" class="text-title" text-anchor="middle">Procesar datos</text>
  <text x="400" y="548" class="text-small" text-anchor="middle">Calcular métricas</text>

  <!-- Flecha -->
  <line x1="400" y1="560" x2="400" y2="590" class="line-green" marker-end="url(#arrowhead-green)"/>

  <!-- 8. Guardar en caché -->
  <rect x="300" y="590" width="200" height="50" rx="5" ry="5" class="box-secondary"/>
  <text x="400" y="610" class="text-title" text-anchor="middle">Cachear resultados</text>
  <text x="400" y="628" class="text-small" text-anchor="middle">TTL: 5 minutos</text>

  <!-- Flecha -->
  <line x1="400" y1="640" x2="400" y2="670" class="line-green" marker-end="url(#arrowhead-green)"/>

  <!-- 9. Renderizar vista -->
  <rect x="300" y="670" width="200" height="50" rx="5" ry="5" class="box-main"/>
  <text x="400" y="690" class="text-title" text-anchor="middle">Renderizar vista</text>
  <text x="400" y="708" class="text-small" text-anchor="middle">Dashboard o JSON</text>

  <!-- FLUJO PARALELO: Tarea programada -->
  <rect x="50" y="80" width="200" height="40" rx="5" ry="5" class="box-filled-green"/>
  <text x="150" y="105" class="text-white" text-anchor="middle">Tarea Programada (01:30)</text>

  <line x1="150" y1="120" x2="150" y2="150" class="line" marker-end="url(#arrowhead)"/>

  <rect x="50" y="150" width="200" height="50" rx="5" ry="5" class="box-action"/>
  <text x="150" y="170" class="text-normal" text-anchor="middle">dedication_collector</text>
  <text x="150" y="188" class="text-small" text-anchor="middle">ejecuta</text>

  <line x1="150" y1="200" x2="150" y2="230" class="line" marker-end="url(#arrowhead)"/>

  <rect x="50" y="230" width="200" height="50" rx="5" ry="5" class="box-secondary"/>
  <text x="150" y="250" class="text-normal" text-anchor="middle">Procesar logs</text>
  <text x="150" y="268" class="text-small" text-anchor="middle">desde última ejecución</text>

  <line x1="150" y1="280" x2="150" y2="310" class="line" marker-end="url(#arrowhead)"/>

  <rect x="50" y="310" width="200" height="50" rx="5" ry="5" class="box-secondary"/>
  <text x="150" y="330" class="text-normal" text-anchor="middle">Calcular sesiones</text>
  <text x="150" y="348" class="text-small" text-anchor="middle">por usuario/curso</text>

  <line x1="150" y1="360" x2="150" y2="390" class="line" marker-end="url(#arrowhead)"/>

  <rect x="50" y="390" width="200" height="50" rx="5" ry="5" class="box-action"/>
  <text x="150" y="410" class="text-normal" text-anchor="middle">Insertar en BD</text>
  <text x="150" y="428" class="text-small" text-anchor="middle">report_platform_usage_ded</text>

  <!-- Flecha desde tarea a BD -->
  <path d="M 150 440 L 150 770 L 300 770" class="line" marker-end="url(#arrowhead)" stroke-dasharray="5,5"/>

  <!-- Base de datos -->
  <rect x="300" y="750" width="200" height="80" rx="5" ry="5" class="box-filled-green"/>
  <text x="400" y="770" class="text-white" text-anchor="middle">Base de Datos</text>
  <text x="400" y="790" class="text-small" text-anchor="middle">report_platform_usage_ded</text>
  <text x="400" y="807" class="text-small" text-anchor="middle">logstore_standard_log</text>
  <text x="400" y="824" class="text-small" text-anchor="middle">user, course, course_completions</text>

  <!-- FLUJO EXPORTACIÓN -->
  <rect x="550" y="80" width="200" height="40" rx="5" ry="5" class="box-filled-green"/>
  <text x="650" y="105" class="text-white" text-anchor="middle">Flujo de Exportación</text>

  <line x1="650" y1="120" x2="650" y2="150" class="line" marker-end="url(#arrowhead)"/>

  <rect x="550" y="150" width="200" height="50" rx="5" ry="5" class="box-main"/>
  <text x="650" y="170" class="text-normal" text-anchor="middle">Clic en botón</text>
  <text x="650" y="188" class="text-small" text-anchor="middle">Exportar</text>

  <line x1="650" y1="200" x2="650" y2="230" class="line" marker-end="url(#arrowhead)"/>

  <rect x="550" y="230" width="200" height="50" rx="5" ry="5" class="box-action"/>
  <text x="650" y="250" class="text-normal" text-anchor="middle">export.php</text>
  <text x="650" y="268" class="text-small" text-anchor="middle">Validar sesskey</text>

  <line x1="650" y1="280" x2="650" y2="310" class="line" marker-end="url(#arrowhead)"/>

  <rect x="550" y="310" width="200" height="50" rx="5" ry="5" class="box-secondary"/>
  <text x="650" y="330" class="text-normal" text-anchor="middle">Crear report</text>
  <text x="650" y="348" class="text-small" text-anchor="middle">Sin caché (datos frescos)</text>

  <line x1="650" y1="360" x2="650" y2="390" class="line" marker-end="url(#arrowhead)"/>

  <polygon points="650,390 750,425 650,460 550,425" class="box-decision"/>
  <text x="650" y="425" class="text-title" text-anchor="middle">Formato?</text>

  <!-- Excel con gráficos -->
  <line x1="750" y1="425" x2="750" y2="490" class="line" marker-end="url(#arrowhead)"/>
  <text x="755" y="455" class="text-small">Excel</text>

  <rect x="700" y="490" width="100" height="50" rx="5" ry="5" class="box-secondary"/>
  <text x="750" y="510" class="text-small" text-anchor="middle">excel_</text>
  <text x="750" y="528" class="text-small" text-anchor="middle">exporter</text>

  <!-- CSV -->
  <line x1="550" y1="425" x2="550" y2="490" class="line" marker-end="url(#arrowhead)"/>
  <text x="520" y="455" class="text-small">CSV</text>

  <rect x="500" y="490" width="100" height="50" rx="5" ry="5" class="box-secondary"/>
  <text x="550" y="518" class="text-small" text-anchor="middle">exporter</text>

  <!-- Flechas a descarga -->
  <line x1="550" y1="540" x2="650" y2="560" class="line" marker-end="url(#arrowhead)"/>
  <line x1="750" y1="540" x2="650" y2="560" class="line" marker-end="url(#arrowhead)"/>

  <rect x="550" y="560" width="200" height="50" rx="5" ry="5" class="box-action"/>
  <text x="650" y="580" class="text-normal" text-anchor="middle">Generar archivo</text>
  <text x="650" y="598" class="text-small" text-anchor="middle">Enviar al navegador</text>

  <line x1="650" y1="610" x2="650" y2="640" class="line" marker-end="url(#arrowhead)"/>

  <rect x="550" y="640" width="200" height="50" rx="5" ry="5" class="box-filled-green"/>
  <text x="650" y="665" class="text-white" text-anchor="middle">Usuario descarga archivo</text>

</svg>
