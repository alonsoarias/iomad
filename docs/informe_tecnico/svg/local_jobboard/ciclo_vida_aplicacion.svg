<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <style>
      .bg { fill: #FAFAFA; }
      .header-bg { fill: #1B9E88; }
      .header-text { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #FFFFFF; }
      .state-box { stroke-width: 2; rx: 8; }
      .state-pending { fill: #FFF3E0; stroke: #FCBD05; }
      .state-review { fill: #E3F2FD; stroke: #1B9E88; }
      .state-approved { fill: #E8F5E9; stroke: #4CAF50; }
      .state-rejected { fill: #FFEBEE; stroke: #EB4335; }
      .state-text { font-family: Arial, sans-serif; font-size: 12px; fill: #333333; font-weight: bold; }
      .state-desc { font-family: Arial, sans-serif; font-size: 10px; fill: #666666; }
      .arrow { fill: #646363; }
      .arrow-line { stroke: #646363; stroke-width: 2; fill: none; }
      .transition-text { font-family: Arial, sans-serif; font-size: 9px; fill: #646363; }
      .phase-label { font-family: Arial, sans-serif; font-size: 11px; fill: #1B9E88; font-weight: bold; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" class="arrow"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" class="bg"/>

  <!-- Header -->
  <rect x="0" y="0" width="900" height="50" class="header-bg"/>
  <text x="450" y="32" text-anchor="middle" class="header-text">Ciclo de Vida de una Postulacion - local_jobboard</text>

  <!-- Phase Labels -->
  <text x="150" y="80" text-anchor="middle" class="phase-label">REGISTRO</text>
  <text x="350" y="80" text-anchor="middle" class="phase-label">DOCUMENTACION</text>
  <text x="550" y="80" text-anchor="middle" class="phase-label">REVISION</text>
  <text x="750" y="80" text-anchor="middle" class="phase-label">DECISION</text>

  <!-- Vertical phase separators -->
  <line x1="250" y1="70" x2="250" y2="550" stroke="#EEEEEE" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="450" y1="70" x2="450" y2="550" stroke="#EEEEEE" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="650" y1="70" x2="650" y2="550" stroke="#EEEEEE" stroke-width="1" stroke-dasharray="5,5"/>

  <!-- States Row 1 - Main flow -->
  <!-- Estado: Borrador -->
  <rect x="50" y="120" width="180" height="60" class="state-box state-pending"/>
  <text x="140" y="145" text-anchor="middle" class="state-text">BORRADOR</text>
  <text x="140" y="162" text-anchor="middle" class="state-desc">Usuario registra datos basicos</text>

  <!-- Estado: Documentos Pendientes -->
  <rect x="260" y="120" width="180" height="60" class="state-box state-pending"/>
  <text x="350" y="145" text-anchor="middle" class="state-text">DOCS PENDIENTES</text>
  <text x="350" y="162" text-anchor="middle" class="state-desc">Esperando subida de documentos</text>

  <!-- Estado: En Revision -->
  <rect x="470" y="120" width="180" height="60" class="state-box state-review"/>
  <text x="560" y="145" text-anchor="middle" class="state-text">EN REVISION</text>
  <text x="560" y="162" text-anchor="middle" class="state-desc">Revisor valida documentos</text>

  <!-- Estado: Aprobado -->
  <rect x="680" y="120" width="180" height="60" class="state-box state-approved"/>
  <text x="770" y="145" text-anchor="middle" class="state-text">APROBADO</text>
  <text x="770" y="162" text-anchor="middle" class="state-desc">Postulacion aceptada</text>

  <!-- Arrows Row 1 -->
  <path d="M 230 150 L 255 150" class="arrow-line" marker-end="url(#arrowhead)"/>
  <text x="243" y="140" text-anchor="middle" class="transition-text">Enviar</text>

  <path d="M 440 150 L 465 150" class="arrow-line" marker-end="url(#arrowhead)"/>
  <text x="453" y="140" text-anchor="middle" class="transition-text">Completar</text>

  <path d="M 650 150 L 675 150" class="arrow-line" marker-end="url(#arrowhead)"/>
  <text x="663" y="140" text-anchor="middle" class="transition-text">Validar OK</text>

  <!-- States Row 2 - Document cycle -->
  <rect x="260" y="250" width="180" height="60" class="state-box state-review"/>
  <text x="350" y="275" text-anchor="middle" class="state-text">DOC EN VALIDACION</text>
  <text x="350" y="292" text-anchor="middle" class="state-desc">Documento siendo revisado</text>

  <rect x="470" y="250" width="180" height="60" class="state-box state-pending"/>
  <text x="560" y="275" text-anchor="middle" class="state-text">OBSERVACIONES</text>
  <text x="560" y="292" text-anchor="middle" class="state-desc">Documento requiere correccion</text>

  <!-- Arrows Row 2 -->
  <path d="M 350 180 L 350 245" class="arrow-line" marker-end="url(#arrowhead)"/>
  <text x="365" y="215" class="transition-text">Subir doc</text>

  <path d="M 440 280 L 465 280" class="arrow-line" marker-end="url(#arrowhead)"/>
  <text x="453" y="270" text-anchor="middle" class="transition-text">Rechazar</text>

  <path d="M 560 310 L 560 340 L 310 340 L 310 290" class="arrow-line" marker-end="url(#arrowhead)"/>
  <text x="435" y="355" text-anchor="middle" class="transition-text">Corregir y resubir</text>

  <path d="M 350 250 L 350 180" class="arrow-line" marker-end="url(#arrowhead)" stroke-dasharray="3,3"/>
  <text x="320" y="215" class="transition-text">Validar</text>

  <!-- States Row 3 - Rejection path -->
  <rect x="680" y="250" width="180" height="60" class="state-box state-rejected"/>
  <text x="770" y="275" text-anchor="middle" class="state-text">RECHAZADO</text>
  <text x="770" y="292" text-anchor="middle" class="state-desc">Postulacion no aprobada</text>

  <!-- Arrow to rejection -->
  <path d="M 650 160 L 700 160 L 700 245" class="arrow-line" marker-end="url(#arrowhead)"/>
  <text x="720" y="200" class="transition-text">Rechazar</text>

  <!-- Special states -->
  <rect x="50" y="380" width="180" height="60" class="state-box state-pending"/>
  <text x="140" y="405" text-anchor="middle" class="state-text">ENTREVISTA</text>
  <text x="140" y="422" text-anchor="middle" class="state-desc">Programar entrevista</text>

  <rect x="260" y="380" width="180" height="60" class="state-box state-review"/>
  <text x="350" y="405" text-anchor="middle" class="state-text">EVALUACION</text>
  <text x="350" y="422" text-anchor="middle" class="state-desc">Calificacion de competencias</text>

  <rect x="470" y="380" width="180" height="60" class="state-box state-approved"/>
  <text x="560" y="405" text-anchor="middle" class="state-text">CONTRATACION</text>
  <text x="560" y="422" text-anchor="middle" class="state-desc">Proceso de vinculacion</text>

  <!-- Arrows from approved -->
  <path d="M 770 180 L 770 340 L 140 340 L 140 375" class="arrow-line" marker-end="url(#arrowhead)"/>
  <text x="450" y="330" text-anchor="middle" class="transition-text">Siguiente fase (opcional)</text>

  <path d="M 230 410 L 255 410" class="arrow-line" marker-end="url(#arrowhead)"/>
  <path d="M 440 410 L 465 410" class="arrow-line" marker-end="url(#arrowhead)"/>

  <!-- Legend -->
  <g transform="translate(50, 480)">
    <rect x="0" y="0" width="800" height="100" rx="8" fill="#F5F5F5" stroke="#CCCCCC" stroke-width="1"/>
    <text x="400" y="25" text-anchor="middle" style="font-family: Arial; font-size: 12px; font-weight: bold; fill: #333;">Leyenda de Estados</text>

    <rect x="30" y="40" width="80" height="25" class="state-box state-pending"/>
    <text x="70" y="57" text-anchor="middle" class="state-desc">Pendiente</text>

    <rect x="140" y="40" width="80" height="25" class="state-box state-review"/>
    <text x="180" y="57" text-anchor="middle" class="state-desc">En proceso</text>

    <rect x="250" y="40" width="80" height="25" class="state-box state-approved"/>
    <text x="290" y="57" text-anchor="middle" class="state-desc">Completado</text>

    <rect x="360" y="40" width="80" height="25" class="state-box state-rejected"/>
    <text x="400" y="57" text-anchor="middle" class="state-desc">Rechazado</text>

    <text x="500" y="55" class="state-desc">Flujo principal: linea continua</text>
    <text x="500" y="75" class="state-desc">Flujo alternativo: linea punteada</text>
  </g>
</svg>
