<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <style>
      .bg { fill: #FAFAFA; }
      .header-bg { fill: #1B9E88; }
      .header-text { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #FFFFFF; }
      .state-box { stroke-width: 2; }
      .state-pending { fill: #FFF3E0; stroke: #FCBD05; }
      .state-review { fill: #E3F2FD; stroke: #1B9E88; }
      .state-approved { fill: #E8F5E9; stroke: #4CAF50; }
      .state-rejected { fill: #FFEBEE; stroke: #EB4335; }
      .state-text { font-family: Arial, sans-serif; font-size: 11px; fill: #333333; font-weight: bold; }
      .state-desc { font-family: Arial, sans-serif; font-size: 9px; fill: #666666; }
      .arrow { fill: #646363; }
      .arrow-line { stroke: #646363; stroke-width: 2; fill: none; }
      .transition-text { font-family: Arial, sans-serif; font-size: 8px; fill: #646363; }
      .phase-label { font-family: Arial, sans-serif; font-size: 12px; fill: #1B9E88; font-weight: bold; }
      .phase-bg { fill: #F5F5F5; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" class="arrow"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="700" class="bg"/>

  <!-- Header -->
  <rect x="0" y="0" width="1000" height="50" class="header-bg"/>
  <text x="500" y="32" text-anchor="middle" class="header-text">Ciclo de Vida de una Postulación - local_jobboard</text>

  <!-- Phase backgrounds -->
  <rect x="20" y="60" width="230" height="480" rx="10" class="phase-bg" opacity="0.5"/>
  <rect x="260" y="60" width="230" height="480" rx="10" class="phase-bg" opacity="0.5"/>
  <rect x="500" y="60" width="230" height="480" rx="10" class="phase-bg" opacity="0.5"/>
  <rect x="740" y="60" width="230" height="480" rx="10" class="phase-bg" opacity="0.5"/>

  <!-- Phase Labels -->
  <text x="135" y="85" text-anchor="middle" class="phase-label">REGISTRO</text>
  <text x="375" y="85" text-anchor="middle" class="phase-label">DOCUMENTACIÓN</text>
  <text x="615" y="85" text-anchor="middle" class="phase-label">REVISIÓN</text>
  <text x="855" y="85" text-anchor="middle" class="phase-label">DECISIÓN</text>

  <!-- Row 1: Main flow -->
  <!-- Estado: Borrador -->
  <g transform="translate(40, 110)">
    <rect x="0" y="0" width="190" height="60" rx="8" class="state-box state-pending"/>
    <text x="95" y="28" text-anchor="middle" class="state-text">BORRADOR</text>
    <text x="95" y="45" text-anchor="middle" class="state-desc">Usuario registra datos básicos</text>
  </g>

  <!-- Estado: Documentos Pendientes -->
  <g transform="translate(280, 110)">
    <rect x="0" y="0" width="190" height="60" rx="8" class="state-box state-pending"/>
    <text x="95" y="28" text-anchor="middle" class="state-text">DOCS PENDIENTES</text>
    <text x="95" y="45" text-anchor="middle" class="state-desc">Esperando subida de documentos</text>
  </g>

  <!-- Estado: En Revisión -->
  <g transform="translate(520, 110)">
    <rect x="0" y="0" width="190" height="60" rx="8" class="state-box state-review"/>
    <text x="95" y="28" text-anchor="middle" class="state-text">EN REVISIÓN</text>
    <text x="95" y="45" text-anchor="middle" class="state-desc">Revisor valida documentos</text>
  </g>

  <!-- Estado: Aprobado -->
  <g transform="translate(760, 110)">
    <rect x="0" y="0" width="190" height="60" rx="8" class="state-box state-approved"/>
    <text x="95" y="28" text-anchor="middle" class="state-text">APROBADO</text>
    <text x="95" y="45" text-anchor="middle" class="state-desc">Postulación aceptada</text>
  </g>

  <!-- Arrows Row 1 -->
  <path d="M 230 140 L 275 140" class="arrow-line" marker-end="url(#arrowhead)"/>
  <text x="252" y="132" text-anchor="middle" class="transition-text">Enviar</text>

  <path d="M 470 140 L 515 140" class="arrow-line" marker-end="url(#arrowhead)"/>
  <text x="492" y="132" text-anchor="middle" class="transition-text">Completar</text>

  <path d="M 710 140 L 755 140" class="arrow-line" marker-end="url(#arrowhead)"/>
  <text x="732" y="132" text-anchor="middle" class="transition-text">Validar OK</text>

  <!-- Row 2: Document cycle -->
  <!-- Estado: Doc en Validación -->
  <g transform="translate(280, 220)">
    <rect x="0" y="0" width="190" height="60" rx="8" class="state-box state-review"/>
    <text x="95" y="28" text-anchor="middle" class="state-text">DOC EN VALIDACIÓN</text>
    <text x="95" y="45" text-anchor="middle" class="state-desc">Documento siendo revisado</text>
  </g>

  <!-- Estado: Observaciones -->
  <g transform="translate(520, 220)">
    <rect x="0" y="0" width="190" height="60" rx="8" class="state-box state-pending"/>
    <text x="95" y="28" text-anchor="middle" class="state-text">OBSERVACIONES</text>
    <text x="95" y="45" text-anchor="middle" class="state-desc">Documento requiere corrección</text>
  </g>

  <!-- Estado: Rechazado -->
  <g transform="translate(760, 220)">
    <rect x="0" y="0" width="190" height="60" rx="8" class="state-box state-rejected"/>
    <text x="95" y="28" text-anchor="middle" class="state-text">RECHAZADO</text>
    <text x="95" y="45" text-anchor="middle" class="state-desc">Postulación no aprobada</text>
  </g>

  <!-- Arrows Row 2 -->
  <path d="M 375 170 L 375 215" class="arrow-line" marker-end="url(#arrowhead)"/>
  <text x="390" y="195" class="transition-text">Subir doc</text>

  <path d="M 470 250 L 515 250" class="arrow-line" marker-end="url(#arrowhead)"/>
  <text x="492" y="242" text-anchor="middle" class="transition-text">Rechazar</text>

  <!-- Arrow back from Observaciones to Doc en Validación -->
  <path d="M 615 280 L 615 310 L 375 310 L 375 285" class="arrow-line" marker-end="url(#arrowhead)"/>
  <text x="495" y="325" text-anchor="middle" class="transition-text">Corregir y resubir</text>

  <!-- Arrow from Doc Validación back up -->
  <path d="M 340 220 L 340 190 L 375 190 L 375 175" class="arrow-line" marker-end="url(#arrowhead)" stroke-dasharray="4,2"/>
  <text x="305" y="200" class="transition-text">Validar</text>

  <!-- Arrow to Rechazado from Revisión -->
  <path d="M 710 155 L 740 155 L 740 215" class="arrow-line" marker-end="url(#arrowhead)"/>
  <text x="755" y="185" class="transition-text">Rechazar</text>

  <!-- Row 3: Final stages -->
  <!-- Estado: Entrevista -->
  <g transform="translate(40, 380)">
    <rect x="0" y="0" width="190" height="60" rx="8" class="state-box state-pending"/>
    <text x="95" y="28" text-anchor="middle" class="state-text">ENTREVISTA</text>
    <text x="95" y="45" text-anchor="middle" class="state-desc">Programar entrevista</text>
  </g>

  <!-- Estado: Evaluación -->
  <g transform="translate(280, 380)">
    <rect x="0" y="0" width="190" height="60" rx="8" class="state-box state-review"/>
    <text x="95" y="28" text-anchor="middle" class="state-text">EVALUACIÓN</text>
    <text x="95" y="45" text-anchor="middle" class="state-desc">Calificación de competencias</text>
  </g>

  <!-- Estado: Contratación -->
  <g transform="translate(520, 380)">
    <rect x="0" y="0" width="190" height="60" rx="8" class="state-box state-approved"/>
    <text x="95" y="28" text-anchor="middle" class="state-text">CONTRATACIÓN</text>
    <text x="95" y="45" text-anchor="middle" class="state-desc">Proceso de vinculación</text>
  </g>

  <!-- Arrows from Aprobado to Entrevista -->
  <path d="M 855 170 L 855 350 L 135 350 L 135 375" class="arrow-line" marker-end="url(#arrowhead)"/>
  <text x="500" y="342" text-anchor="middle" class="transition-text">Siguiente fase (opcional)</text>

  <!-- Arrows Row 3 -->
  <path d="M 230 410 L 275 410" class="arrow-line" marker-end="url(#arrowhead)"/>
  <path d="M 470 410 L 515 410" class="arrow-line" marker-end="url(#arrowhead)"/>

  <!-- Legend -->
  <g transform="translate(50, 560)">
    <rect x="0" y="0" width="900" height="100" rx="8" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="1"/>
    <text x="450" y="25" text-anchor="middle" style="font-family: Arial; font-size: 12px; font-weight: bold; fill: #333;">Leyenda de Estados</text>

    <rect x="40" y="45" width="100" height="30" rx="6" class="state-box state-pending"/>
    <text x="90" y="65" text-anchor="middle" class="state-desc">Pendiente</text>

    <rect x="180" y="45" width="100" height="30" rx="6" class="state-box state-review"/>
    <text x="230" y="65" text-anchor="middle" class="state-desc">En proceso</text>

    <rect x="320" y="45" width="100" height="30" rx="6" class="state-box state-approved"/>
    <text x="370" y="65" text-anchor="middle" class="state-desc">Completado</text>

    <rect x="460" y="45" width="100" height="30" rx="6" class="state-box state-rejected"/>
    <text x="510" y="65" text-anchor="middle" class="state-desc">Rechazado</text>

    <line x1="620" y1="55" x2="680" y2="55" class="arrow-line" marker-end="url(#arrowhead)"/>
    <text x="650" y="75" text-anchor="middle" class="state-desc">Flujo principal</text>

    <line x1="750" y1="55" x2="810" y2="55" stroke="#646363" stroke-width="2" stroke-dasharray="4,2" fill="none" marker-end="url(#arrowhead)"/>
    <text x="780" y="75" text-anchor="middle" class="state-desc">Flujo alternativo</text>
  </g>
</svg>
