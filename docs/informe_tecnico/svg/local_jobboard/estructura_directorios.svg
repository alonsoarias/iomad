        <use href="#folder" x="50" y="0" width="16" height="16" class="folder-icon"/>
        <text x="72" y="12" class="subfolder-text">components/</text>
        <text x="155" y="12" class="file-text">(componentes reutilizables)</text>
      </g>

      <g transform="translate(15, 55)">
        <line x1="30" y1="10" x2="50" y2="10" class="tree-line"/>
        <use href="#folder" x="50" y="0" width="16" height="16" class="folder-icon"/>
        <text x="72" y="12" class="subfolder-text">pages/</text>
        <text x="115" y="12" class="file-text">(12 subcarpetas: admin, applications, vacancies...)</text>
      </g>

      <g transform="translate(15, 80)">
        <line x1="30" y1="10" x2="50" y2="10" class="tree-line"/>
        <use href="#folder" x="50" y="0" width="16" height="16" class="folder-icon"/>
        <text x="72" y="12" class="subfolder-text">partials/</text>
        <text x="130" y="12" class="file-text">(fragmentos parciales)</text>
      </g>
    </g>

    <!-- tests/ -->
