    <rect x="0" y="0" width="420" height="220" rx="8" fill="#FFFFFF" stroke="#1B9E88" stroke-width="2"/>
    <rect x="0" y="0" width="420" height="30" rx="8" class="header-bg"/>
    <text x="210" y="20" text-anchor="middle" class="header-text" style="font-size: 13px;">ARCHIVOS RAÍZ</text>

    <g transform="translate(20, 50)">
      <use href="#file" x="0" y="0" width="16" height="16" class="file-icon"/>
      <text x="25" y="12" class="file-text">version.php</text>
      <text x="150" y="12" class="subfolder-text">v2025011000</text>
    </g>

    <g transform="translate(20, 80)">
      <use href="#file" x="0" y="0" width="16" height="16" class="file-icon"/>
      <text x="25" y="12" class="file-text">lib.php</text>
      <text x="150" y="12" class="subfolder-text">38KB - API principal</text>
    </g>

    <g transform="translate(20, 110)">
      <use href="#file" x="0" y="0" width="16" height="16" class="file-icon"/>
      <text x="25" y="12" class="file-text">settings.php</text>
      <text x="150" y="12" class="subfolder-text">configuración</text>
    </g>

    <g transform="translate(20, 140)">
      <use href="#file" x="0" y="0" width="16" height="16" class="file-icon"/>
      <text x="25" y="12" class="file-text">index.php</text>
      <text x="150" y="12" class="subfolder-text">listado vacantes</text>
    </g>

    <g transform="translate(20, 170)">
      <use href="#file" x="0" y="0" width="16" height="16" class="file-icon"/>
      <text x="25" y="12" class="file-text">signup.php</text>
      <text x="150" y="12" class="subfolder-text">registro usuarios</text>
    </g>

    <g transform="translate(20, 200)">
      <use href="#file" x="0" y="0" width="16" height="16" class="file-icon"/>
      <text x="25" y="12" class="file-text">styles.css</text>
      <text x="150" y="12" class="subfolder-text">159KB - estilos</text>
    </g>
  </g>

  <!-- Statistics Box -->
  <g transform="translate(480, 320)">
    <rect x="0" y="0" width="420" height="180" rx="8" class="stats-box"/>
    <rect x="0" y="0" width="420" height="30" rx="8" class="header-bg"/>
    <text x="210" y="20" text-anchor="middle" class="header-text" style="font-size: 13px;">ESTADÍSTICAS DEL PLUGIN</text>

    <!-- Left column stats -->
    <text x="30" y="60" class="file-text" style="font-size: 12px;">Carpetas principales:</text>
    <text x="180" y="60" class="folder-text">11</text>

    <text x="30" y="85" class="file-text" style="font-size: 12px;">Subcarpetas:</text>
    <text x="180" y="85" class="folder-text">23</text>

    <text x="30" y="110" class="file-text" style="font-size: 12px;">Tablas en BD:</text>
    <text x="180" y="110" class="folder-text">24</text>

    <text x="30" y="135" class="file-text" style="font-size: 12px;">Capacidades:</text>
    <text x="180" y="135" class="folder-text">27</text>

    <text x="30" y="160" class="file-text" style="font-size: 12px;">Módulos AMD:</text>
    <text x="180" y="160" class="folder-text">22</text>

    <!-- Right column stats -->
    <text x="240" y="60" class="file-text" style="font-size: 12px;">Clases PHP:</text>
    <text x="370" y="60" class="folder-text">35+</text>

    <text x="240" y="85" class="file-text" style="font-size: 12px;">Servicios Web:</text>
    <text x="370" y="85" class="folder-text">5</text>

    <text x="240" y="110" class="file-text" style="font-size: 12px;">Eventos:</text>
    <text x="370" y="110" class="folder-text">9</text>

    <text x="240" y="135" class="file-text" style="font-size: 12px;">Formularios:</text>
    <text x="370" y="135" class="folder-text">9</text>

    <text x="240" y="160" class="file-text" style="font-size: 12px;">Plantillas:</text>
    <text x="370" y="160" class="folder-text">50+</text>
  </g>

  <!-- DB Files Detail -->
  <g transform="translate(480, 530)">
    <rect x="0" y="0" width="420" height="120" rx="8" fill="#FFF8E1" stroke="#FCBD05" stroke-width="2"/>
    <rect x="0" y="0" width="420" height="30" rx="8" fill="#FCBD05"/>
    <text x="210" y="20" text-anchor="middle" style="font-family: Arial; font-size: 13px; font-weight: bold; fill: #333;">ARCHIVOS db/</text>

    <text x="20" y="55" class="file-text">install.xml</text>
    <text x="130" y="55" class="subfolder-text">24 tablas definidas</text>

    <text x="20" y="80" class="file-text">access.php</text>
    <text x="130" y="80" class="subfolder-text">27 capabilities</text>

    <text x="20" y="105" class="file-text">services.php</text>
    <text x="130" y="105" class="subfolder-text">5 web services</text>

    <text x="250" y="55" class="file-text">upgrade.php</text>
    <text x="250" y="80" class="file-text">tasks.php</text>
    <text x="250" y="105" class="file-text">events.php</text>
  </g>

  <!-- Footer note -->
  <rect x="30" y="1020" width="890" height="60" rx="8" fill="#E8F5E9" stroke="#1B9E88" stroke-width="1"/>
  <text x="475" y="1045" text-anchor="middle" style="font-family: Arial; font-size: 11px; fill: #333; font-weight: bold;">
    Plugin local_jobboard - Sistema de Gestión de Vacantes ISER
  </text>
  <text x="475" y="1065" text-anchor="middle" style="font-family: Arial; font-size: 10px; fill: #646363;">
    Nota: Se excluye la carpeta cli/ según especificación del proyecto. Estructura basada en Moodle 4.x
  </text>
</svg>
