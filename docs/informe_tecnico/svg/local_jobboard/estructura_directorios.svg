      <use href="#folder" x="30" y="0" width="18" height="18" class="folder-icon"/>
      <text x="55" y="13" class="folder-text">classes/</text>
      <rect x="115" y="0" width="80" height="16" rx="3" class="badge"/>
      <text x="155" y="11" text-anchor="middle" class="badge-text">Lógica negocio</text>

      <line x1="45" y1="25" x2="45" y2="200" class="tree-line"/>

