      <g transform="translate(15, 30)">
        <line x1="30" y1="10" x2="50" y2="10" class="tree-line"/>
        <use href="#folder" x="50" y="0" width="16" height="16" class="folder-icon"/>
        <text x="72" y="12" class="subfolder-text">event/ (9 eventos)</text>
      </g>

      <g transform="translate(15, 55)">
        <line x1="30" y1="10" x2="50" y2="10" class="tree-line"/>
        <use href="#folder" x="50" y="0" width="16" height="16" class="folder-icon"/>
        <text x="72" y="12" class="subfolder-text">external/ (5 servicios)</text>
      </g>

      <g transform="translate(15, 80)">
        <line x1="30" y1="10" x2="50" y2="10" class="tree-line"/>
        <use href="#folder" x="50" y="0" width="16" height="16" class="folder-icon"/>
        <text x="72" y="12" class="subfolder-text">forms/ (9 formularios)</text>
      </g>

      <g transform="translate(15, 105)">
        <line x1="30" y1="10" x2="50" y2="10" class="tree-line"/>
        <use href="#folder" x="50" y="0" width="16" height="16" class="folder-icon"/>
        <text x="72" y="12" class="subfolder-text">helper/ (auxiliares)</text>
      </g>

      <g transform="translate(15, 130)">
        <line x1="30" y1="10" x2="50" y2="10" class="tree-line"/>
        <use href="#folder" x="50" y="0" width="16" height="16" class="folder-icon"/>
        <text x="72" y="12" class="subfolder-text">migration/ (migración)</text>
      </g>

      <g transform="translate(15, 155)">
        <line x1="30" y1="10" x2="50" y2="10" class="tree-line"/>
        <use href="#folder" x="50" y="0" width="16" height="16" class="folder-icon"/>
        <text x="72" y="12" class="subfolder-text">output/ (renderizadores)</text>
      </g>

      <g transform="translate(15, 180)">
        <line x1="30" y1="10" x2="50" y2="10" class="tree-line"/>
        <use href="#folder" x="50" y="0" width="16" height="16" class="folder-icon"/>
        <text x="72" y="12" class="subfolder-text">task/ (tareas cron)</text>
      </g>
    </g>

    <!-- Convocatoria/ -->
    <g transform="translate(0, 450)">
      <line x1="10" y1="10" x2="30" y2="10" class="tree-line"/>
      <use href="#folder" x="30" y="0" width="18" height="18" class="folder-icon"/>
      <text x="55" y="13" class="folder-text">Convocatoria/</text>
      <text x="150" y="13" class="subfolder-text">(módulo)</text>
    </g>

