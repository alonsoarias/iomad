    <g transform="translate(0, 900)">
      <line x1="10" y1="10" x2="30" y2="10" class="tree-line"/>
      <use href="#folder" x="30" y="0" width="18" height="18" class="folder-icon"/>
      <text x="55" y="13" class="folder-text">views/</text>
      <text x="100" y="13" class="subfolder-text">(vistas)</text>
    </g>
  </g>

  <!-- Right Column: Root Files and Statistics -->
  <g transform="translate(480, 70)">
