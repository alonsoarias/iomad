      <g transform="translate(15, 105)">
        <line x1="30" y1="10" x2="50" y2="10" class="tree-line"/>
        <use href="#folder" x="50" y="0" width="16" height="16" class="folder-icon"/>
        <text x="72" y="12" class="subfolder-text">helper/</text>
        <text x="120" y="12" class="file-text">(clases auxiliares)</text>
      </g>

      <!-- classes/migration -->
      <g transform="translate(15, 130)">
        <line x1="30" y1="10" x2="50" y2="10" class="tree-line"/>
        <use href="#folder" x="50" y="0" width="16" height="16" class="folder-icon"/>
        <text x="72" y="12" class="subfolder-text">migration/</text>
        <text x="138" y="12" class="file-text">(herramientas de migración)</text>
      </g>

