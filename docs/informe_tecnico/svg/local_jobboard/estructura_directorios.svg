      <line x1="10" y1="10" x2="30" y2="10" class="tree-line"/>
      <use href="#folder" x="30" y="0" width="18" height="18" class="folder-icon"/>
      <text x="55" y="13" class="folder-text">tests/</text>

      <line x1="45" y1="25" x2="45" y2="55" class="tree-line"/>

      <g transform="translate(15, 30)">
        <line x1="30" y1="10" x2="50" y2="10" class="tree-line"/>
        <use href="#folder" x="50" y="0" width="16" height="16" class="folder-icon"/>
        <text x="72" y="12" class="subfolder-text">behat/</text>
        <text x="115" y="12" class="file-text">(tests de comportamiento)</text>
      </g>

      <g transform="translate(15, 55)">
        <line x1="30" y1="10" x2="50" y2="10" class="tree-line"/>
        <use href="#folder" x="50" y="0" width="16" height="16" class="folder-icon"/>
        <text x="72" y="12" class="subfolder-text">generator/</text>
        <text x="135" y="12" class="file-text">(generadores de datos de prueba)</text>
      </g>
    </g>

    <!-- views/ -->
    <g transform="translate(0, 855)">
      <line x1="10" y1="10" x2="30" y2="10" class="tree-line"/>
      <use href="#folder" x="30" y="0" width="18" height="18" class="folder-icon"/>
      <text x="55" y="13" class="folder-text">views/</text>
      <text x="100" y="13" class="subfolder-text">(vistas del plugin)</text>
    </g>
  </g>

  <!-- Root files section -->
  <g transform="translate(500, 70)">
    <text x="0" y="0" class="section-title">ARCHIVOS RAÍZ:</text>

    <g transform="translate(0, 20)">
      <use href="#file" x="0" y="0" width="14" height="14" class="file-icon"/>
      <text x="20" y="11" class="file-text">version.php</text>
      <text x="120" y="11" style="font-size: 10px; fill: #999;">(v2025011000)</text>
    </g>

    <g transform="translate(0, 40)">
      <use href="#file" x="0" y="0" width="14" height="14" class="file-icon"/>
      <text x="20" y="11" class="file-text">lib.php</text>
      <text x="80" y="11" style="font-size: 10px; fill: #999;">(38KB - API principal)</text>
    </g>

    <g transform="translate(0, 60)">
      <use href="#file" x="0" y="0" width="14" height="14" class="file-icon"/>
      <text x="20" y="11" class="file-text">settings.php</text>
      <text x="105" y="11" style="font-size: 10px; fill: #999;">(configuración)</text>
    </g>

    <g transform="translate(0, 80)">
      <use href="#file" x="0" y="0" width="14" height="14" class="file-icon"/>
      <text x="20" y="11" class="file-text">index.php</text>
      <text x="95" y="11" style="font-size: 10px; fill: #999;">(listado vacantes)</text>
    </g>

    <g transform="translate(0, 100)">
      <use href="#file" x="0" y="0" width="14" height="14" class="file-icon"/>
      <text x="20" y="11" class="file-text">signup.php</text>
      <text x="100" y="11" style="font-size: 10px; fill: #999;">(registro usuarios)</text>
    </g>

    <g transform="translate(0, 120)">
      <use href="#file" x="0" y="0" width="14" height="14" class="file-icon"/>
      <text x="20" y="11" class="file-text">styles.css</text>
      <text x="95" y="11" style="font-size: 10px; fill: #999;">(159KB - estilos)</text>
    </g>
  </g>

  <!-- Statistics -->
  <g transform="translate(500, 250)">
    <rect x="0" y="0" width="370" height="140" rx="8" fill="#F0F0F0" stroke="#1B9E88" stroke-width="2"/>
    <text x="185" y="25" text-anchor="middle" class="section-title">ESTADÍSTICAS DEL PLUGIN</text>

    <text x="20" y="50" class="file-text">Carpetas principales: 11</text>
    <text x="20" y="70" class="file-text">Subcarpetas: 23</text>
    <text x="20" y="90" class="file-text">Tablas en BD: 24</text>
    <text x="20" y="110" class="file-text">Capacidades: 27</text>
    <text x="20" y="130" class="file-text">Módulos AMD: 22</text>

    <text x="200" y="50" class="file-text">Clases PHP: 35+</text>
    <text x="200" y="70" class="file-text">Servicios Web: 5</text>
    <text x="200" y="90" class="file-text">Eventos: 9</text>
    <text x="200" y="110" class="file-text">Formularios: 9</text>
    <text x="200" y="130" class="file-text">Plantillas: 50+</text>
  </g>

  <!-- Footer note -->
  <rect x="20" y="910" width="860" height="30" rx="5" fill="#FFF8E1" stroke="#FCBD05" stroke-width="1"/>
  <text x="450" y="930" text-anchor="middle" style="font-family: Arial; font-size: 11px; fill: #646363;">
    Nota: Se excluye la carpeta cli/ según especificación del proyecto. Estructura basada en Moodle 4.x
  </text>
</svg>
