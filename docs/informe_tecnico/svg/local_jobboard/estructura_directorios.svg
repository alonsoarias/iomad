<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 950" width="900" height="950">
  <defs>
    <style>
      .bg { fill: #FAFAFA; }
      .header-bg { fill: #1B9E88; }
      .header-text { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #FFFFFF; }
      .folder-icon { fill: #FCBD05; }
      .folder-text { font-family: 'Consolas', 'Monaco', monospace; font-size: 13px; fill: #1B9E88; font-weight: bold; }
      .subfolder-text { font-family: 'Consolas', 'Monaco', monospace; font-size: 12px; fill: #646363; }
      .file-icon { fill: #EB4335; }
      .file-text { font-family: 'Consolas', 'Monaco', monospace; font-size: 11px; fill: #333333; }
      .tree-line { stroke: #CCCCCC; stroke-width: 1; fill: none; }
      .badge { fill: #1B9E88; rx: 3; }
      .badge-text { font-family: Arial, sans-serif; font-size: 9px; fill: #FFFFFF; }
      .section-title { font-family: Arial, sans-serif; font-size: 11px; fill: #646363; font-weight: bold; }
    </style>
    <!-- Folder icon -->
    <symbol id="folder" viewBox="0 0 24 24">
      <path d="M10 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/>
    </symbol>
    <!-- File icon -->
    <symbol id="file" viewBox="0 0 24 24">
      <path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm-1 7V3.5L18.5 9H13z"/>
    </symbol>
  </defs>

  <!-- Background -->
  <rect width="900" height="950" class="bg"/>

  <!-- Header -->
  <rect x="0" y="0" width="900" height="50" class="header-bg"/>
  <text x="450" y="32" text-anchor="middle" class="header-text">Estructura de Directorios - local_jobboard</text>

  <!-- Tree Structure -->
  <g transform="translate(30, 70)">
    <!-- Root folder -->
    <use href="#folder" x="0" y="0" width="20" height="20" class="folder-icon"/>
    <text x="28" y="15" class="folder-text">local/jobboard/</text>
    <rect x="160" y="3" width="90" height="16" class="badge"/>
    <text x="205" y="14" text-anchor="middle" class="badge-text">Plugin principal</text>

    <!-- Vertical line from root -->
    <line x1="10" y1="25" x2="10" y2="860" class="tree-line"/>

    <!-- admin/ -->
    <g transform="translate(0, 35)">
      <line x1="10" y1="10" x2="30" y2="10" class="tree-line"/>
      <use href="#folder" x="30" y="0" width="18" height="18" class="folder-icon"/>
      <text x="55" y="13" class="folder-text">admin/</text>
      <text x="110" y="13" class="subfolder-text">(16 archivos PHP)</text>
      <!-- admin files detail -->
      <text x="55" y="30" class="file-text">assign_reviewer.php, bulk_validate.php, doctypes.php, edit.php...</text>
    </g>

    <!-- ajax/ -->
    <g transform="translate(0, 85)">
      <line x1="10" y1="10" x2="30" y2="10" class="tree-line"/>
      <use href="#folder" x="30" y="0" width="18" height="18" class="folder-icon"/>
      <text x="55" y="13" class="folder-text">ajax/</text>
      <text x="105" y="13" class="subfolder-text">(4 archivos PHP)</text>
      <text x="55" y="30" class="file-text">filter_public_vacancies.php, get_companies.php, get_convocatorias.php, get_departments.php</text>
    </g>

    <!-- amd/ -->
    <g transform="translate(0, 135)">
      <line x1="10" y1="10" x2="30" y2="10" class="tree-line"/>
      <use href="#folder" x="30" y="0" width="18" height="18" class="folder-icon"/>
      <text x="55" y="13" class="folder-text">amd/</text>
      <text x="95" y="13" class="subfolder-text">(Módulos JavaScript AMD)</text>

      <line x1="45" y1="25" x2="45" y2="80" class="tree-line"/>

      <!-- amd/build -->
      <g transform="translate(15, 30)">
        <line x1="30" y1="10" x2="50" y2="10" class="tree-line"/>
        <use href="#folder" x="50" y="0" width="16" height="16" class="folder-icon"/>
        <text x="72" y="12" class="subfolder-text">build/</text>
        <text x="115" y="12" class="file-text">(22 módulos minificados)</text>
      </g>

      <!-- amd/src -->
      <g transform="translate(15, 55)">
        <line x1="30" y1="10" x2="50" y2="10" class="tree-line"/>
        <use href="#folder" x="50" y="0" width="16" height="16" class="folder-icon"/>
        <text x="72" y="12" class="subfolder-text">src/</text>
        <text x="105" y="12" class="file-text">(22 módulos fuente: dashboard.js, bulk_actions.js...)</text>
      </g>
    </g>

    <!-- classes/ -->
    <g transform="translate(0, 240)">
      <line x1="10" y1="10" x2="30" y2="10" class="tree-line"/>
      <use href="#folder" x="30" y="0" width="18" height="18" class="folder-icon"/>
      <text x="55" y="13" class="folder-text">classes/</text>
      <rect x="115" y="0" width="75" height="16" class="badge"/>
      <text x="152" y="11" text-anchor="middle" class="badge-text">Lógica de negocio</text>

      <line x1="45" y1="25" x2="45" y2="195" class="tree-line"/>

      <!-- classes/event -->
      <g transform="translate(15, 30)">
        <line x1="30" y1="10" x2="50" y2="10" class="tree-line"/>
        <use href="#folder" x="50" y="0" width="16" height="16" class="folder-icon"/>
        <text x="72" y="12" class="subfolder-text">event/</text>
        <text x="115" y="12" class="file-text">(9 eventos Moodle)</text>
      </g>

      <!-- classes/external -->
      <g transform="translate(15, 55)">
        <line x1="30" y1="10" x2="50" y2="10" class="tree-line"/>
        <use href="#folder" x="50" y="0" width="16" height="16" class="folder-icon"/>
        <text x="72" y="12" class="subfolder-text">external/</text>
        <text x="130" y="12" class="file-text">(5 servicios web)</text>
      </g>

      <!-- classes/forms -->
      <g transform="translate(15, 80)">
        <line x1="30" y1="10" x2="50" y2="10" class="tree-line"/>
        <use href="#folder" x="50" y="0" width="16" height="16" class="folder-icon"/>
        <text x="72" y="12" class="subfolder-text">forms/</text>
        <text x="120" y="12" class="file-text">(9 formularios Moodle)</text>
      </g>

