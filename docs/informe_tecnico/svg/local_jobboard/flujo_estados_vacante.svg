<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#646363"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1B9E88"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#EB4335"/>
    </marker>

    <style>
      .box-main { fill: #FFFFFF; stroke: #1B9E88; stroke-width: 2; }
      .box-secondary { fill: #FFFFFF; stroke: #646363; stroke-width: 2; }
      .box-filled-green { fill: #1B9E88; stroke: #1B9E88; stroke-width: 2; }
      .box-filled-red { fill: #EB4335; stroke: #EB4335; stroke-width: 2; }
      .box-filled-gray { fill: #646363; stroke: #646363; stroke-width: 2; }
      .text-title { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #000000; }
      .text-normal { font-family: Arial, sans-serif; font-size: 12px; fill: #000000; }
      .text-small { font-family: Arial, sans-serif; font-size: 11px; fill: #646363; }
      .text-white { font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #FFFFFF; }
      .line { stroke: #646363; stroke-width: 2; fill: none; }
      .line-green { stroke: #1B9E88; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <rect width="800" height="400" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="text-title" style="font-size: 16px;">Flujo de Estados - Vacante (Vacancy)</text>

  <!-- Estado: DRAFT -->
  <rect x="50" y="80" width="150" height="80" rx="5" ry="5" class="box-filled-gray"/>
  <text x="125" y="110" text-anchor="middle" class="text-white">DRAFT</text>
  <text x="125" y="130" text-anchor="middle" style="font-family: Arial; font-size: 11px; fill: #FFFFFF;">Borrador</text>
  <text x="125" y="145" text-anchor="middle" style="font-family: Arial; font-size: 10px; fill: #FFFFFF;">Estado inicial</text>

  <!-- Estado: PUBLISHED -->
  <rect x="325" y="80" width="150" height="80" rx="5" ry="5" class="box-filled-green"/>
  <text x="400" y="110" text-anchor="middle" class="text-white">PUBLISHED</text>
  <text x="400" y="130" text-anchor="middle" style="font-family: Arial; font-size: 11px; fill: #FFFFFF;">Publicada</text>
  <text x="400" y="145" text-anchor="middle" style="font-family: Arial; font-size: 10px; fill: #FFFFFF;">Recibe aplicaciones</text>

  <!-- Estado: CLOSED -->
  <rect x="600" y="80" width="150" height="80" rx="5" ry="5" class="box-filled-red"/>
  <text x="675" y="110" text-anchor="middle" class="text-white">CLOSED</text>
  <text x="675" y="130" text-anchor="middle" style="font-family: Arial; font-size: 11px; fill: #FFFFFF;">Cerrada</text>
  <text x="675" y="145" text-anchor="middle" style="font-family: Arial; font-size: 10px; fill: #FFFFFF;">No acepta más</text>

  <!-- Estado: ASSIGNED -->
  <rect x="600" y="240" width="150" height="80" rx="5" ry="5" fill="#FFFFFF" stroke="#FCBD05" stroke-width="2"/>
  <text x="675" y="270" text-anchor="middle" class="text-title" fill="#FCBD05">ASSIGNED</text>
  <text x="675" y="290" text-anchor="middle" style="font-family: Arial; font-size: 11px; fill: #646363;">Asignada</text>
  <text x="675" y="305" text-anchor="middle" style="font-family: Arial; font-size: 10px; fill: #646363;">Plazas cubiertas</text>

  <!-- Transiciones -->
  <!-- draft -> published -->
  <line x1="200" y1="120" x2="325" y2="120" class="line-green" marker-end="url(#arrowhead-green)"/>
  <text x="245" y="110" text-anchor="middle" class="text-small">publish()</text>

  <!-- published -> closed -->
  <line x1="475" y1="120" x2="600" y2="120" class="line" marker-end="url(#arrowhead)"/>
  <text x="520" y="110" text-anchor="middle" class="text-small">close()</text>
  <text x="520" y="135" text-anchor="middle" style="font-size: 10px; fill: #646363;">Manual o automático</text>

  <!-- closed -> published (reopen) -->
  <path d="M 675 80 Q 675 50 400 50 Q 325 50 325 80" class="line" marker-end="url(#arrowhead)" stroke-dasharray="5,5"/>
  <text x="500" y="45" text-anchor="middle" class="text-small">reopen()</text>

  <!-- closed -> assigned -->
  <line x1="675" y1="160" x2="675" y2="240" class="line" marker-end="url(#arrowhead)"/>
  <text x="690" y="200" class="text-small">assign()</text>

  <!-- Legend Box -->
  <rect x="50" y="330" width="700" height="50" rx="5" ry="5" fill="#F9F9F9" stroke="#646363" stroke-width="1"/>
  <text x="60" y="350" class="text-normal" style="font-weight: bold;">Flujo de Estados:</text>
  <text x="60" y="365" class="text-small">1. DRAFT: Creada pero no visible para postulantes | 2. PUBLISHED: Abierta y recibiendo aplicaciones</text>
  <text x="60" y="377" class="text-small">3. CLOSED: Cerrada (manual o por fecha) | 4. ASSIGNED: Todas las plazas han sido asignadas</text>
</svg>
