<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700">
  <defs>
    <style>
      .bg { fill: #FAFAFA; }
      .header-bg { fill: #1B9E88; }
      .header-text { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #FFFFFF; }
      .actor { fill: #FCBD05; stroke: #646363; stroke-width: 2; }
      .actor-text { font-family: Arial, sans-serif; font-size: 11px; fill: #333333; font-weight: bold; }
      .usecase { fill: #FFFFFF; stroke: #1B9E88; stroke-width: 2; }
      .usecase-text { font-family: Arial, sans-serif; font-size: 10px; fill: #333333; }
      .system-box { fill: none; stroke: #EB4335; stroke-width: 2; stroke-dasharray: 5,3; }
      .system-label { font-family: Arial, sans-serif; font-size: 12px; fill: #EB4335; font-weight: bold; }
      .connection { stroke: #646363; stroke-width: 1.5; fill: none; }
      .legend-box { fill: #F5F5F5; stroke: #CCCCCC; stroke-width: 1; }
      .legend-text { font-family: Arial, sans-serif; font-size: 10px; fill: #666666; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="700" class="bg"/>

  <!-- Header -->
  <rect x="0" y="0" width="900" height="50" class="header-bg"/>
  <text x="450" y="32" text-anchor="middle" class="header-text">Diagrama de Casos de Uso - local_jobboard</text>

  <!-- System boundary -->
  <rect x="200" y="70" width="500" height="580" rx="10" class="system-box"/>
  <text x="450" y="90" text-anchor="middle" class="system-label">Sistema local_jobboard</text>

  <!-- Actors - Left side -->
  <!-- Docente/Aspirante -->
  <g transform="translate(60, 150)">
    <circle cx="30" cy="15" r="15" class="actor"/>
    <line x1="30" y1="30" x2="30" y2="60" stroke="#646363" stroke-width="2"/>
    <line x1="10" y1="45" x2="50" y2="45" stroke="#646363" stroke-width="2"/>
    <line x1="30" y1="60" x2="15" y2="85" stroke="#646363" stroke-width="2"/>
    <line x1="30" y1="60" x2="45" y2="85" stroke="#646363" stroke-width="2"/>
    <text x="30" y="105" text-anchor="middle" class="actor-text">Docente/</text>
    <text x="30" y="118" text-anchor="middle" class="actor-text">Aspirante</text>
  </g>

  <!-- Revisor -->
  <g transform="translate(60, 350)">
    <circle cx="30" cy="15" r="15" class="actor"/>
    <line x1="30" y1="30" x2="30" y2="60" stroke="#646363" stroke-width="2"/>
    <line x1="10" y1="45" x2="50" y2="45" stroke="#646363" stroke-width="2"/>
    <line x1="30" y1="60" x2="15" y2="85" stroke="#646363" stroke-width="2"/>
    <line x1="30" y1="60" x2="45" y2="85" stroke="#646363" stroke-width="2"/>
    <text x="30" y="105" text-anchor="middle" class="actor-text">Revisor de</text>
    <text x="30" y="118" text-anchor="middle" class="actor-text">Documentos</text>
  </g>

  <!-- Actors - Right side -->
  <!-- Administrador -->
  <g transform="translate(790, 150)">
    <circle cx="30" cy="15" r="15" class="actor"/>
    <line x1="30" y1="30" x2="30" y2="60" stroke="#646363" stroke-width="2"/>
    <line x1="10" y1="45" x2="50" y2="45" stroke="#646363" stroke-width="2"/>
    <line x1="30" y1="60" x2="15" y2="85" stroke="#646363" stroke-width="2"/>
    <line x1="30" y1="60" x2="45" y2="85" stroke="#646363" stroke-width="2"/>
    <text x="30" y="105" text-anchor="middle" class="actor-text">Administrador</text>
  </g>

  <!-- Decano -->
  <g transform="translate(790, 350)">
    <circle cx="30" cy="15" r="15" class="actor"/>
    <line x1="30" y1="30" x2="30" y2="60" stroke="#646363" stroke-width="2"/>
    <line x1="10" y1="45" x2="50" y2="45" stroke="#646363" stroke-width="2"/>
    <line x1="30" y1="60" x2="15" y2="85" stroke="#646363" stroke-width="2"/>
    <line x1="30" y1="60" x2="45" y2="85" stroke="#646363" stroke-width="2"/>
    <text x="30" y="105" text-anchor="middle" class="actor-text">Decano de</text>
    <text x="30" y="118" text-anchor="middle" class="actor-text">Facultad</text>
  </g>

  <!-- RRHH -->
  <g transform="translate(790, 520)">
    <circle cx="30" cy="15" r="15" class="actor"/>
    <line x1="30" y1="30" x2="30" y2="60" stroke="#646363" stroke-width="2"/>
    <line x1="10" y1="45" x2="50" y2="45" stroke="#646363" stroke-width="2"/>
    <line x1="30" y1="60" x2="15" y2="85" stroke="#646363" stroke-width="2"/>
    <line x1="30" y1="60" x2="45" y2="85" stroke="#646363" stroke-width="2"/>
    <text x="30" y="105" text-anchor="middle" class="actor-text">Recursos</text>
    <text x="30" y="118" text-anchor="middle" class="actor-text">Humanos</text>
  </g>

  <!-- Use Cases -->
  <!-- Docente use cases -->
  <ellipse cx="320" cy="130" rx="90" ry="25" class="usecase"/>
  <text x="320" y="135" text-anchor="middle" class="usecase-text">Registrarse en plataforma</text>

  <ellipse cx="320" cy="190" rx="90" ry="25" class="usecase"/>
  <text x="320" y="195" text-anchor="middle" class="usecase-text">Ver vacantes disponibles</text>

  <ellipse cx="320" cy="250" rx="90" ry="25" class="usecase"/>
  <text x="320" y="255" text-anchor="middle" class="usecase-text">Postularse a vacante</text>

  <ellipse cx="320" cy="310" rx="90" ry="25" class="usecase"/>
  <text x="320" y="315" text-anchor="middle" class="usecase-text">Subir documentos</text>

  <ellipse cx="320" cy="370" rx="90" ry="25" class="usecase"/>
  <text x="320" y="375" text-anchor="middle" class="usecase-text">Consultar estado</text>

  <!-- Revisor use cases -->
  <ellipse cx="320" cy="440" rx="90" ry="25" class="usecase"/>
  <text x="320" y="445" text-anchor="middle" class="usecase-text">Validar documentos</text>

  <ellipse cx="320" cy="500" rx="90" ry="25" class="usecase"/>
  <text x="320" y="505" text-anchor="middle" class="usecase-text">Enviar observaciones</text>

  <!-- Admin use cases -->
  <ellipse cx="570" cy="130" rx="90" ry="25" class="usecase"/>
  <text x="570" y="135" text-anchor="middle" class="usecase-text">Gestionar vacantes</text>

  <ellipse cx="570" cy="190" rx="90" ry="25" class="usecase"/>
  <text x="570" y="195" text-anchor="middle" class="usecase-text">Configurar tipos doc.</text>

  <ellipse cx="570" cy="250" rx="90" ry="25" class="usecase"/>
  <text x="570" y="255" text-anchor="middle" class="usecase-text">Gestionar convocatorias</text>

  <ellipse cx="570" cy="310" rx="90" ry="25" class="usecase"/>
  <text x="570" y="315" text-anchor="middle" class="usecase-text">Asignar revisores</text>

  <!-- Decano use cases -->
  <ellipse cx="570" cy="380" rx="90" ry="25" class="usecase"/>
  <text x="570" y="385" text-anchor="middle" class="usecase-text">Ver dashboard facultad</text>

  <ellipse cx="570" cy="440" rx="90" ry="25" class="usecase"/>
  <text x="570" y="445" text-anchor="middle" class="usecase-text">Aprobar postulaciones</text>

  <!-- RRHH use cases -->
  <ellipse cx="570" cy="510" rx="90" ry="25" class="usecase"/>
  <text x="570" y="515" text-anchor="middle" class="usecase-text">Exportar reportes</text>

  <ellipse cx="570" cy="570" rx="90" ry="25" class="usecase"/>
  <text x="570" y="575" text-anchor="middle" class="usecase-text">Gestionar contratacion</text>

  <!-- Connections - Docente -->
  <line x1="120" y1="190" x2="230" y2="130" class="connection"/>
  <line x1="120" y1="200" x2="230" y2="190" class="connection"/>
  <line x1="120" y1="210" x2="230" y2="250" class="connection"/>
  <line x1="120" y1="220" x2="230" y2="310" class="connection"/>
  <line x1="120" y1="230" x2="230" y2="370" class="connection"/>

  <!-- Connections - Revisor -->
  <line x1="120" y1="400" x2="230" y2="440" class="connection"/>
  <line x1="120" y1="410" x2="230" y2="500" class="connection"/>

  <!-- Connections - Admin -->
  <line x1="780" y1="190" x2="660" y2="130" class="connection"/>
  <line x1="780" y1="200" x2="660" y2="190" class="connection"/>
  <line x1="780" y1="210" x2="660" y2="250" class="connection"/>
  <line x1="780" y1="220" x2="660" y2="310" class="connection"/>

  <!-- Connections - Decano -->
  <line x1="780" y1="400" x2="660" y2="380" class="connection"/>
  <line x1="780" y1="410" x2="660" y2="440" class="connection"/>

  <!-- Connections - RRHH -->
  <line x1="780" y1="565" x2="660" y2="510" class="connection"/>
  <line x1="780" y1="575" x2="660" y2="570" class="connection"/>

  <!-- Legend -->
  <rect x="20" y="620" width="180" height="70" rx="5" class="legend-box"/>
  <text x="30" y="640" class="legend-text" font-weight="bold">Leyenda:</text>
  <circle cx="45" cy="658" r="8" class="actor"/>
  <text x="60" y="662" class="legend-text">Actor del sistema</text>
  <ellipse cx="45" cy="680" rx="15" ry="8" class="usecase"/>
  <text x="65" y="684" class="legend-text">Caso de uso</text>
</svg>
