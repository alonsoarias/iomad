<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#646363"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1B9E88"/>
    </marker>

    <style>
      .box-main { fill: #FFFFFF; stroke: #1B9E88; stroke-width: 2; }
      .box-secondary { fill: #FFFFFF; stroke: #646363; stroke-width: 2; }
      .box-action { fill: #FFFFFF; stroke: #FCBD05; stroke-width: 2; }
      .text-title { font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #000000; }
      .text-normal { font-family: Arial, sans-serif; font-size: 11px; fill: #000000; }
      .text-small { font-family: Arial, sans-serif; font-size: 10px; fill: #646363; }
      .line { stroke: #646363; stroke-width: 2; fill: none; }
      .line-green { stroke: #1B9E88; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <rect width="800" height="600" fill="#FFFFFF"/>

  <!-- Convocatoria Class -->
  <rect x="30" y="30" width="200" height="120" rx="5" ry="5" class="box-main"/>
  <rect x="30" y="30" width="200" height="25" rx="5" ry="5" fill="#1B9E88"/>
  <text x="130" y="47" text-anchor="middle" class="text-title" fill="#FFFFFF">Convocatoria</text>
  <line x1="30" y1="55" x2="230" y2="55" class="line-green"/>
  <text x="35" y="70" class="text-normal">+ id: int</text>
  <text x="35" y="83" class="text-normal">+ code: string</text>
  <text x="35" y="96" class="text-normal">+ status: string</text>
  <text x="35" y="109" class="text-normal">+ startdate: int</text>
  <text x="35" y="122" class="text-normal">+ enddate: int</text>
  <line x1="30" y1="128" x2="230" y2="128" class="line"/>
  <text x="35" y="143" class="text-small">+ create()</text>

  <!-- Vacancy Class -->
  <rect x="300" y="30" width="200" height="150" rx="5" ry="5" class="box-main"/>
  <rect x="300" y="30" width="200" height="25" rx="5" ry="5" fill="#1B9E88"/>
  <text x="400" y="47" text-anchor="middle" class="text-title" fill="#FFFFFF">Vacancy</text>
  <line x1="300" y1="55" x2="500" y2="55" class="line-green"/>
  <text x="305" y="70" class="text-normal">+ id: int</text>
  <text x="305" y="83" class="text-normal">+ code: string</text>
  <text x="305" y="96" class="text-normal">+ title: string</text>
  <text x="305" y="109" class="text-normal">+ status: string</text>
  <text x="305" y="122" class="text-normal">+ convocatoriaid: int</text>
  <text x="305" y="135" class="text-normal">+ positions: int</text>
  <text x="305" y="148" class="text-normal">+ contracttype: string</text>
  <line x1="300" y1="154" x2="500" y2="154" class="line"/>
  <text x="305" y="169" class="text-small">+ publish()</text>

  <!-- Application Class -->
  <rect x="570" y="30" width="200" height="150" rx="5" ry="5" class="box-main"/>
  <rect x="570" y="30" width="200" height="25" rx="5" ry="5" fill="#1B9E88"/>
  <text x="670" y="47" text-anchor="middle" class="text-title" fill="#FFFFFF">Application</text>
  <line x1="570" y1="55" x2="770" y2="55" class="line-green"/>
  <text x="575" y="70" class="text-normal">+ id: int</text>
  <text x="575" y="83" class="text-normal">+ vacancyid: int</text>
  <text x="575" y="96" class="text-normal">+ userid: int</text>
  <text x="575" y="109" class="text-normal">+ status: string</text>
  <text x="575" y="122" class="text-normal">+ reviewerid: int</text>
  <text x="575" y="135" class="text-normal">+ isexemption: bool</text>
  <text x="575" y="148" class="text-normal">+ consentgiven: bool</text>
  <line x1="570" y1="154" x2="770" y2="154" class="line"/>
  <text x="575" y="169" class="text-small">+ submit()</text>

  <!-- Document Class -->
  <rect x="570" y="240" width="200" height="150" rx="5" ry="5" class="box-secondary"/>
  <rect x="570" y="240" width="200" height="25" rx="5" ry="5" fill="#646363"/>
  <text x="670" y="257" text-anchor="middle" class="text-title" fill="#FFFFFF">Document</text>
  <line x1="570" y1="265" x2="770" y2="265" class="line"/>
  <text x="575" y="280" class="text-normal">+ id: int</text>
  <text x="575" y="293" class="text-normal">+ applicationid: int</text>
  <text x="575" y="306" class="text-normal">+ documenttype: string</text>
  <text x="575" y="319" class="text-normal">+ filename: string</text>
  <text x="575" y="332" class="text-normal">+ contenthash: string</text>
  <text x="575" y="345" class="text-normal">+ issuperseded: bool</text>
  <line x1="570" y1="351" x2="770" y2="351" class="line"/>
  <text x="575" y="366" class="text-small">+ validate()</text>
  <text x="575" y="379" class="text-small">+ reject()</text>

  <!-- Exemption Class -->
  <rect x="30" y="240" width="200" height="150" rx="5" ry="5" class="box-action"/>
  <rect x="30" y="240" width="200" height="25" rx="5" ry="5" fill="#FCBD05"/>
  <text x="130" y="257" text-anchor="middle" class="text-title">Exemption</text>
  <line x1="30" y1="265" x2="230" y2="265" stroke="#FCBD05" stroke-width="2" fill="none"/>
  <text x="35" y="280" class="text-normal">+ id: int</text>
  <text x="35" y="293" class="text-normal">+ userid: int</text>
  <text x="35" y="306" class="text-normal">+ type: string</text>
  <text x="35" y="319" class="text-normal">+ isactive: bool</text>
  <text x="35" y="332" class="text-normal">+ startdate: int</text>
  <text x="35" y="345" class="text-normal">+ enddate: int</text>
  <line x1="30" y1="351" x2="230" y2="351" stroke="#FCBD05" stroke-width="2" fill="none"/>
  <text x="35" y="366" class="text-small">+ create()</text>
  <text x="35" y="379" class="text-small">+ revoke()</text>

  <!-- Relationships -->
  <!-- Convocatoria -> Vacancy (1:N) -->
  <line x1="230" y1="90" x2="300" y2="90" class="line" marker-end="url(#arrowhead)"/>
  <text x="245" y="85" class="text-small">1</text>
  <text x="280" y="85" class="text-small">*</text>

  <!-- Vacancy -> Application (1:N) -->
  <line x1="500" y1="105" x2="570" y2="105" class="line" marker-end="url(#arrowhead)"/>
  <text x="515" y="100" class="text-small">1</text>
  <text x="550" y="100" class="text-small">*</text>

  <!-- Application -> Document (1:N) -->
  <line x1="670" y1="180" x2="670" y2="240" class="line" marker-end="url(#arrowhead)"/>
  <text x="675" y="200" class="text-small">1</text>
  <text x="675" y="235" class="text-small">*</text>

  <!-- Exemption -> Application (1:N) -->
  <path d="M 230 315 L 400 315 L 400 180" class="line" marker-end="url(#arrowhead)"/>
  <text x="235" y="310" class="text-small">1</text>
  <text x="405" y="195" class="text-small">0..*</text>
  <text x="290" y="310" class="text-small">reduces requirements</text>

  <!-- Legend -->
  <rect x="30" y="450" width="740" height="130" rx="5" ry="5" fill="#F9F9F9" stroke="#646363" stroke-width="1"/>
  <text x="40" y="470" class="text-title">Clases Principales - local_jobboard</text>

  <text x="40" y="490" class="text-normal">Convocatoria: Campaña de reclutamiento que agrupa vacantes</text>
  <text x="40" y="505" class="text-normal">Vacancy: Vacante específica para una materia/programa</text>
  <text x="40" y="520" class="text-normal">Application: Postulación de un usuario a una vacante</text>
  <text x="40" y="535" class="text-normal">Document: Documento subido y validado (RUT, HV, Diploma, etc.)</text>
  <text x="40" y="550" class="text-normal">Exemption: Exención de documentos para personal histórico ISER</text>

  <text x="40" y="570" class="text-small" fill="#646363">Estados: draft/published/closed (Vacancy) | submitted/under_review/docs_validated/selected/rejected (Application)</text>
</svg>
