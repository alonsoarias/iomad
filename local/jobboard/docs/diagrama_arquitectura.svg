    <text x="355" y="70" text-anchor="middle" fill="white" font-size="9">create, validate</text>
    <text x="355" y="82" text-anchor="middle" fill="white" font-size="9">reject, get_stats</text>
    <text x="355" y="94" text-anchor="middle" fill="white" font-size="9">store_from_draft</text>

    <rect x="430" y="35" width="130" height="70" fill="#1B9E88" rx="5" filter="url(#shadow)"/>
