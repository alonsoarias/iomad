<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1B9E88;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#158a76;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#646363"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="#f8f9fa"/>

  <!-- Title -->
  <rect x="0" y="0" width="1200" height="60" fill="url(#headerGrad)"/>
  <text x="600" y="38" text-anchor="middle" fill="white" font-size="24" font-weight="bold">
    Arquitectura del Plugin local_jobboard
  </text>

  <!-- Legend -->
  <g transform="translate(950, 80)">
    <rect x="0" y="0" width="220" height="120" fill="white" stroke="#ddd" rx="5" filter="url(#shadow)"/>
    <text x="110" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#646363">Leyenda</text>
    <rect x="10" y="35" width="20" height="15" fill="#1B9E88" rx="2"/>
    <text x="40" y="47" font-size="11" fill="#646363">Componente Core</text>
    <rect x="10" y="55" width="20" height="15" fill="#FCBD05" rx="2"/>
    <text x="40" y="67" font-size="11" fill="#646363">Base de Datos</text>
    <rect x="10" y="75" width="20" height="15" fill="#EB4335" rx="2"/>
    <text x="40" y="87" font-size="11" fill="#646363">Interfaz Usuario</text>
    <rect x="10" y="95" width="20" height="15" fill="#646363" rx="2"/>
    <text x="40" y="107" font-size="11" fill="#646363">Servicios Externos</text>
  </g>

  <!-- Main Plugin Box -->
  <rect x="50" y="80" width="880" height="800" fill="white" stroke="#1B9E88" stroke-width="3" rx="10" filter="url(#shadow)"/>
  <rect x="50" y="80" width="880" height="40" fill="#1B9E88" rx="10"/>
  <rect x="50" y="100" width="880" height="20" fill="#1B9E88"/>
  <text x="490" y="108" text-anchor="middle" fill="white" font-size="16" font-weight="bold">
    local_jobboard v4.0.2
  </text>

  <!-- Entry Points Layer -->
  <g transform="translate(70, 140)">
    <rect x="0" y="0" width="840" height="80" fill="#EB4335" fill-opacity="0.1" stroke="#EB4335" stroke-dasharray="5,5" rx="5"/>
    <text x="10" y="20" font-size="12" font-weight="bold" fill="#EB4335">Puntos de Entrada (UI)</text>

    <rect x="10" y="30" width="90" height="40" fill="#EB4335" rx="5" filter="url(#shadow)"/>
    <text x="55" y="55" text-anchor="middle" fill="white" font-size="10">public.php</text>

    <rect x="110" y="30" width="90" height="40" fill="#EB4335" rx="5" filter="url(#shadow)"/>
    <text x="155" y="55" text-anchor="middle" fill="white" font-size="10">signup.php</text>

    <rect x="210" y="30" width="90" height="40" fill="#EB4335" rx="5" filter="url(#shadow)"/>
    <text x="255" y="55" text-anchor="middle" fill="white" font-size="10">index.php</text>

    <rect x="310" y="30" width="120" height="40" fill="#EB4335" rx="5" filter="url(#shadow)"/>
    <text x="370" y="55" text-anchor="middle" fill="white" font-size="10">updateprofile.php</text>

    <rect x="440" y="30" width="130" height="40" fill="#EB4335" rx="5" filter="url(#shadow)"/>
    <text x="505" y="55" text-anchor="middle" fill="white" font-size="10">reupload_document.php</text>

    <rect x="580" y="30" width="110" height="40" fill="#EB4335" rx="5" filter="url(#shadow)"/>
    <text x="635" y="55" text-anchor="middle" fill="white" font-size="10">admin/*.php</text>

    <rect x="700" y="30" width="130" height="40" fill="#EB4335" rx="5" filter="url(#shadow)"/>
    <text x="765" y="55" text-anchor="middle" fill="white" font-size="10">ajax/*.php</text>
