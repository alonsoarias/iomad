    <text x="635" y="150" text-anchor="middle" fill="white" font-size="9">validate_batch</text>
    <text x="635" y="162" text-anchor="middle" fill="white" font-size="9">get_progress</text>
    <text x="635" y="174" text-anchor="middle" fill="white" font-size="9">export_results</text>

