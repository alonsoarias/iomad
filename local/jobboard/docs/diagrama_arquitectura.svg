    <text x="185" y="70" text-anchor="middle" fill="#333" font-size="8">code, title</text>
    <text x="185" y="82" text-anchor="middle" fill="#333" font-size="8">location, modality</text>
    <text x="185" y="94" text-anchor="middle" fill="#333" font-size="8">status, positions</text>

    <rect x="250" y="35" width="110" height="80" fill="#FCBD05" rx="5" filter="url(#shadow)"/>
    <text x="305" y="55" text-anchor="middle" fill="#333" font-size="10" font-weight="bold">application</text>
    <text x="305" y="70" text-anchor="middle" fill="#333" font-size="8">vacancyid, userid</text>
    <text x="305" y="82" text-anchor="middle" fill="#333" font-size="8">status, consent</text>
    <text x="305" y="94" text-anchor="middle" fill="#333" font-size="8">reviewerid</text>

    <rect x="370" y="35" width="110" height="80" fill="#FCBD05" rx="5" filter="url(#shadow)"/>
    <text x="425" y="55" text-anchor="middle" fill="#333" font-size="10" font-weight="bold">document</text>
    <text x="425" y="70" text-anchor="middle" fill="#333" font-size="8">applicationid</text>
    <text x="425" y="82" text-anchor="middle" fill="#333" font-size="8">documenttype</text>
    <text x="425" y="94" text-anchor="middle" fill="#333" font-size="8">contenthash</text>

    <rect x="490" y="35" width="110" height="80" fill="#FCBD05" rx="5" filter="url(#shadow)"/>
    <text x="545" y="55" text-anchor="middle" fill="#333" font-size="10" font-weight="bold">doc_validation</text>
    <text x="545" y="70" text-anchor="middle" fill="#333" font-size="8">documentid</text>
    <text x="545" y="82" text-anchor="middle" fill="#333" font-size="8">status, isvalid</text>
    <text x="545" y="94" text-anchor="middle" fill="#333" font-size="8">checklist</text>

    <rect x="610" y="35" width="100" height="80" fill="#FCBD05" rx="5" filter="url(#shadow)"/>
    <text x="660" y="55" text-anchor="middle" fill="#333" font-size="10" font-weight="bold">audit</text>
    <text x="660" y="70" text-anchor="middle" fill="#333" font-size="8">action, entity</text>
    <text x="660" y="82" text-anchor="middle" fill="#333" font-size="8">previousvalue</text>
    <text x="660" y="94" text-anchor="middle" fill="#333" font-size="8">newvalue</text>

    <rect x="720" y="35" width="110" height="80" fill="#FCBD05" rx="5" filter="url(#shadow)"/>
    <text x="775" y="55" text-anchor="middle" fill="#333" font-size="10" font-weight="bold">+18 tablas</text>
    <text x="775" y="70" text-anchor="middle" fill="#333" font-size="8">exemption, faculty</text>
    <text x="775" y="82" text-anchor="middle" fill="#333" font-size="8">program, interview</text>
    <text x="775" y="94" text-anchor="middle" fill="#333" font-size="8">notification...</text>
