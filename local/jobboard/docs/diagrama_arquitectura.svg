    <text x="65" y="70" text-anchor="middle" fill="#333" font-size="8">code, name</text>
    <text x="65" y="82" text-anchor="middle" fill="#333" font-size="8">startdate, enddate</text>
    <text x="65" y="94" text-anchor="middle" fill="#333" font-size="8">status, terms</text>

    <rect x="130" y="35" width="110" height="80" fill="#FCBD05" rx="5" filter="url(#shadow)"/>
