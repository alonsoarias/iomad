    <text x="215" y="70" text-anchor="middle" fill="white" font-size="9">submit, change_status</text>
    <text x="215" y="82" text-anchor="middle" fill="white" font-size="9">assign_reviewer</text>
    <text x="215" y="94" text-anchor="middle" fill="white" font-size="9">get_documents</text>

    <rect x="290" y="35" width="130" height="70" fill="#1B9E88" rx="5" filter="url(#shadow)"/>
