    <rect x="0" y="0" width="840" height="70" fill="#EB4335" fill-opacity="0.1" stroke="#EB4335" stroke-dasharray="5,5" rx="5"/>
    <text x="10" y="20" font-size="12" font-weight="bold" fill="#EB4335">Módulos AMD JavaScript (22 módulos)</text>
    <text x="10" y="40" font-size="10" fill="#646363">
      dashboard | document_review | vacancy_form | signup_form | public_filters | bulk_actions | grading_panel | ...
    </text>
    <text x="10" y="55" font-size="10" fill="#646363">
