    <rect x="140" y="30" width="120" height="25" fill="#646363" rx="3" filter="url(#shadow)"/>
    <text x="200" y="47" text-anchor="middle" fill="white" font-size="10">Moodle File API</text>

    <rect x="270" y="30" width="120" height="25" fill="#646363" rx="3" filter="url(#shadow)"/>
    <text x="330" y="47" text-anchor="middle" fill="white" font-size="10">Email System</text>

    <rect x="400" y="30" width="120" height="25" fill="#646363" rx="3" filter="url(#shadow)"/>
    <text x="460" y="47" text-anchor="middle" fill="white" font-size="10">Event System</text>

    <rect x="530" y="30" width="120" height="25" fill="#646363" rx="3" filter="url(#shadow)"/>
    <text x="590" y="47" text-anchor="middle" fill="white" font-size="10">Web Services API</text>

    <rect x="660" y="30" width="120" height="25" fill="#646363" rx="3" filter="url(#shadow)"/>
    <text x="720" y="47" text-anchor="middle" fill="white" font-size="10">Scheduled Tasks</text>
  </g>

  <!-- AMD Modules Box -->
