    <text x="75" y="82" text-anchor="middle" fill="white" font-size="9">close, get_list</text>
    <text x="75" y="94" text-anchor="middle" fill="white" font-size="9">check_status</text>

    <rect x="150" y="35" width="130" height="70" fill="#1B9E88" rx="5" filter="url(#shadow)"/>
