    <text x="635" y="70" text-anchor="middle" fill="white" font-size="9">queue, send</text>
    <text x="635" y="82" text-anchor="middle" fill="white" font-size="9">queue_status_change</text>
    <text x="635" y="94" text-anchor="middle" fill="white" font-size="9">retry_failed</text>

