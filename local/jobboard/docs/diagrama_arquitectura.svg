    <text x="495" y="82" text-anchor="middle" fill="white" font-size="9">log_email</text>
    <text x="495" y="94" text-anchor="middle" fill="white" font-size="9">get_trail, cleanup</text>

    <rect x="570" y="35" width="130" height="70" fill="#1B9E88" rx="5" filter="url(#shadow)"/>
